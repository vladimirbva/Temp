<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060b10">
<title>ТЕЧЕТ 01 — подручный калькулятор технолога</title>
<style>
/* ============================================================
   ТЕЧЕТ 01 · NIGHT SHIFT PALETTE
   Dominant: petrol/teal (нефть, ночная смена)
   Accents: amber (сырая нефть), cyan, acid, magenta, blue, red
   ============================================================ */
:root{
  --petrol-900:#04080c; --petrol-800:#060b10; --petrol-700:#0a1620; --petrol-600:#0e2130;
  --petrol-500:#123044; --petrol-400:#1a4257; --petrol-300:#215a74;
  --amber:#ffb020; --cyan:#22d3ee; --acid:#a3e635; --magenta:#f472b6;
  --blue:#4c8dff; --orange:#ff7a45; --violet:#c084fc; --mint:#34d399;
  --ok:#34d399; --warn:#fbbf24; --bad:#ff5470; --info:#38bdf8;

  --bg:var(--petrol-800); --bg2:var(--petrol-900);
  --surface:#0c1620; --surface2:#12212e; --surface3:#172c3c;
  --line:#1d3344; --line2:#27485e;
  --ink:#e9f5fa; --ink2:#b9d2df; --dim:#8ba7b7; --dim2:#63808f;
  --accent:var(--amber); --accent-ink:#1a1204;
  --scrim:rgba(3,7,11,.72);
  --glow:0 0 0 1px rgba(255,176,32,.22), 0 8px 30px -12px rgba(255,176,32,.35);
  --shadow:0 18px 50px -24px rgba(0,0,0,.9);
  --r:14px; --r-sm:10px; --tap:44px;
  --fs:15px; --fs-sm:13px; --fs-xs:11.5px;
  --bw:1px;
  --c1:var(--amber); --c2:var(--cyan); --c3:var(--acid); --c4:var(--magenta);
  --c5:var(--blue); --c6:var(--orange); --c7:var(--mint); --c8:var(--violet);
  --sb-w:11px; --sb-track:#0a141d; --sb-thumb:#22485e; --sb-thumb-h:var(--amber);
  --grain:.045; --aurora:.5;
}
html[data-theme="day"]{
  --bg:#f3efe6; --bg2:#e9e3d6;
  --surface:#fffdf9; --surface2:#f7f2e8; --surface3:#efe7d9;
  --line:#ddd3c2; --line2:#c6b8a2;
  --ink:#15222c; --ink2:#33454f; --dim:#5f6f79; --dim2:#8a97a0;
  --amber:#b45309; --cyan:#0e7490; --acid:#4d7c0f; --magenta:#be185d;
  --blue:#1d4ed8; --orange:#c2410c; --violet:#7e22ce; --mint:#047857;
  --ok:#047857; --warn:#b45309; --bad:#b91c1c; --info:#0369a1;
  --accent:#b45309; --accent-ink:#fff8ec;
  --scrim:rgba(40,32,20,.42);
  --glow:0 0 0 1px rgba(180,83,9,.2), 0 10px 28px -16px rgba(180,83,9,.4);
  --shadow:0 16px 40px -26px rgba(60,45,20,.55);
  --sb-track:#e7e0d1; --sb-thumb:#c3b49c; --sb-thumb-h:#b45309;
  --grain:.03; --aurora:.28;
}
html[data-theme="field"]{
  --bg:#000; --bg2:#000; --surface:#000; --surface2:#0b0b0b; --surface3:#141414;
  --line:#ffffff; --line2:#ffe600;
  --ink:#ffffff; --ink2:#ffffff; --dim:#ffe600; --dim2:#f5f5f5;
  --amber:#ffe600; --cyan:#00ffff; --acid:#00ff66; --magenta:#ff6ad5;
  --blue:#7fb2ff; --orange:#ffa000; --violet:#e0a0ff; --mint:#00ff9c;
  --ok:#00ff66; --warn:#ffe600; --bad:#ff5555; --info:#00ffff;
  --accent:#ffe600; --accent-ink:#000;
  --scrim:rgba(0,0,0,.9);
  --glow:0 0 0 2px #ffe600; --shadow:none;
  --r:6px; --r-sm:4px; --tap:52px; --bw:2px;
  --fs:17px; --fs-sm:15px; --fs-xs:13.5px;
  --sb-w:16px; --sb-track:#000; --sb-thumb:#ffe600; --sb-thumb-h:#fff;
  --grain:0; --aurora:0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:var(--fs)/1.5 "Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; overflow-x:hidden;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-ink)}
/* ---------- scrollbars in the artifact's own language ---------- */
*{scrollbar-width:thin;scrollbar-color:var(--sb-thumb) var(--sb-track)}
::-webkit-scrollbar{width:var(--sb-w);height:var(--sb-w)}
::-webkit-scrollbar-track{background:var(--sb-track);border-left:var(--bw) solid var(--line)}
::-webkit-scrollbar-thumb{background:var(--sb-thumb);border-radius:99px;border:2px solid var(--sb-track)}
::-webkit-scrollbar-thumb:hover{background:var(--sb-thumb-h)}
::-webkit-scrollbar-corner{background:var(--sb-track)}

/* ---------- layered background ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .mesh{position:absolute;inset:-25%;
  background:
    radial-gradient(38% 42% at 12% 8%, rgba(255,176,32,.20), transparent 62%),
    radial-gradient(44% 46% at 88% 4%, rgba(34,211,238,.18), transparent 64%),
    radial-gradient(52% 50% at 74% 88%, rgba(163,230,53,.13), transparent 66%),
    radial-gradient(46% 44% at 22% 92%, rgba(244,114,182,.13), transparent 62%),
    linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%);
  opacity:var(--aurora); filter:saturate(1.15);
  animation:drift 34s ease-in-out infinite alternate;
}
.bg .aurora{position:absolute;left:-10%;right:-10%;top:-30%;height:120%;
  background:conic-gradient(from 200deg at 50% 50%, rgba(34,211,238,.10), rgba(255,176,32,.12), rgba(163,230,53,.08), rgba(244,114,182,.10), rgba(34,211,238,.10));
  filter:blur(70px); opacity:calc(var(--aurora)*.7); animation:swirl 46s linear infinite}
.bg .grain{position:absolute;inset:0;opacity:var(--grain);mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.bg .lines{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(120% 90% at 50% 0%,#000 20%,transparent 75%)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-3%,2%,0) scale(1.06)}}
@keyframes swirl{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bg .mesh,.bg .aurora{animation:none}}

/* ---------- top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:60;height:60px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:blur(14px) saturate(1.2);border-bottom:var(--bw) solid var(--line)}
html[data-theme="field"] .top{background:#000;backdrop-filter:none}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;cursor:pointer;background:none;border:0;padding:4px}
.brand .mark{width:32px;height:32px;flex:0 0 auto}
.brand b{font-size:15px;letter-spacing:.06em;font-weight:800}
.brand span{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--dim);margin-top:-3px}
.searchwrap{flex:1 1 auto;max-width:520px;position:relative;display:flex;align-items:center}
.searchwrap svg{position:absolute;left:11px;width:16px;height:16px;color:var(--dim);pointer-events:none}
#q{width:100%;height:var(--tap);padding:0 84px 0 34px;border-radius:99px;border:var(--bw) solid var(--line);
  background:var(--surface2);color:var(--ink);outline:none;transition:.16s}
#q:focus{border-color:var(--accent);box-shadow:var(--glow)}
.kbd{position:absolute;right:9px;display:flex;gap:4px;pointer-events:none}
.kbd i{font-style:normal;font-size:10px;padding:3px 6px;border-radius:6px;border:var(--bw) solid var(--line2);color:var(--dim);background:var(--surface)}
.topbtns{display:flex;align-items:center;gap:6px;margin-left:auto}
.iconbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:11px;
  border:var(--bw) solid var(--line);background:var(--surface2);cursor:pointer;transition:.15s;position:relative}
.iconbtn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.iconbtn svg{width:19px;height:19px}
.iconbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badgechk{display:flex;align-items:center;gap:7px;height:var(--tap);padding:0 12px;border-radius:11px;
  border:var(--bw) solid var(--line);background:var(--surface2);cursor:pointer;font-size:var(--fs-xs);white-space:nowrap}
.badgechk b{color:var(--ok)}
.badgechk.fail b{color:var(--bad)}
.pill{font-size:10px;padding:2px 7px;border-radius:99px;border:var(--bw) solid var(--line2);color:var(--dim)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}

/* ---------- shell ---------- */
.shell{position:relative;z-index:10;display:grid;grid-template-columns:246px minmax(0,1fr);gap:0;padding-top:60px;min-height:100vh}
.rail{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;border-right:var(--bw) solid var(--line);
  background:color-mix(in srgb,var(--surface) 55%,transparent);padding:14px 10px 26px}
.railgrp{margin-bottom:14px}
.railgrp>h4{margin:0 0 6px 8px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);display:flex;align-items:center;gap:6px}
.railgrp>h4 em{font-style:normal;color:var(--accent);font-size:9px;border:var(--bw) solid var(--line2);border-radius:5px;padding:1px 4px}
.nav{display:flex;align-items:center;gap:9px;width:100%;min-height:var(--tap);padding:8px 10px;border-radius:var(--r-sm);
  border:var(--bw) solid transparent;background:none;cursor:pointer;text-align:left;color:var(--ink2);transition:.14s}
.nav:hover{background:var(--surface2);border-color:var(--line);color:var(--ink);transform:translateX(2px)}
.nav.on{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 20%,transparent),transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--ink);font-weight:650}
.nav.on .ni{color:var(--accent)}
.ni{width:22px;height:22px;flex:0 0 auto;color:var(--dim);display:grid;place-items:center}
.ni svg{width:18px;height:18px}
.nav small{display:block;font-size:10px;color:var(--dim2);font-weight:400}
.nav .fav{margin-left:auto;color:var(--amber);opacity:0;font-size:12px}
.nav .fav.on{opacity:1}
main{min-width:0;padding:20px 22px 90px;max-width:1320px}

/* ---------- headings / cards ---------- */
.crumb{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--dim);margin-bottom:8px;flex-wrap:wrap}
.crumb b{color:var(--accent);font-weight:600}
h1.title{margin:0;font-size:clamp(21px,3.1vw,30px);line-height:1.15;letter-spacing:-.02em;font-weight:800}
.sub{margin:6px 0 0;color:var(--dim);font-size:var(--fs-sm);max-width:78ch}
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.head .acts{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card>.ch{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:var(--bw) solid var(--line);background:var(--surface2)}
.card>.ch h3{margin:0;font-size:var(--fs-sm);font-weight:700;letter-spacing:.01em}
.card>.ch .tag{margin-left:auto;font-size:10px;color:var(--dim);border:var(--bw) solid var(--line2);padding:2px 7px;border-radius:99px}
.card>.cb{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g-layout{grid-template-columns:minmax(300px,380px) minmax(0,1fr)}
.stack{display:grid;gap:14px}
@media(max-width:1080px){.g-layout{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}

/* ---------- inputs ---------- */
.fields{display:grid;gap:11px}
.f{display:grid;gap:5px}
.f>label{font-size:var(--fs-xs);color:var(--dim);display:flex;align-items:center;gap:6px}
.f>label .req{color:var(--accent)}
.inwrap{display:flex;align-items:stretch;border:var(--bw) solid var(--line);border-radius:var(--r-sm);background:var(--surface2);overflow:hidden;transition:.15s;min-height:var(--tap)}
.inwrap:focus-within{border-color:var(--accent);box-shadow:var(--glow)}
.inwrap.err{border-color:var(--bad)}
.inwrap input,.inwrap textarea{flex:1 1 auto;min-width:0;border:0;background:none;outline:none;padding:9px 11px;font-variant-numeric:tabular-nums}
.inwrap textarea{resize:vertical;min-height:120px;font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:var(--fs-sm);line-height:1.6}
.suffix{display:flex;align-items:center;padding:0 10px;font-size:var(--fs-xs);color:var(--dim);border-left:var(--bw) solid var(--line);background:var(--surface3);white-space:nowrap}
.inwrap select{border:0;border-left:var(--bw) solid var(--line);background:var(--surface3);color:var(--ink2);padding:0 8px;font-size:var(--fs-xs);outline:none;cursor:pointer;max-width:118px}
.hint{font-size:10.5px;color:var(--dim2)}
.errmsg{font-size:10.5px;color:var(--bad);display:flex;gap:5px;align-items:center}
.rangewrap{display:flex;align-items:center;gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan));border:var(--bw) solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:99px;background:var(--surface);border:2px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--cyan))}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:99px;background:var(--surface);border:2px solid var(--accent)}
.rnum{min-width:66px;text-align:right;font-size:var(--fs-sm);color:var(--accent);font-weight:650}
.seg{display:flex;flex-wrap:wrap;gap:5px}
.seg button{min-height:36px;padding:5px 11px;border-radius:99px;border:var(--bw) solid var(--line);background:var(--surface2);cursor:pointer;font-size:var(--fs-xs);transition:.14s}
.seg button:hover{border-color:var(--accent);color:var(--accent)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.sw{display:flex;align-items:center;gap:9px;min-height:var(--tap);cursor:pointer;font-size:var(--fs-sm)}
.sw i{width:42px;height:24px;border-radius:99px;background:var(--surface3);border:var(--bw) solid var(--line);position:relative;transition:.18s;flex:0 0 auto}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:99px;background:var(--dim);transition:.18s}
.sw.on i{background:color-mix(in srgb,var(--accent) 35%,var(--surface3));border-color:var(--accent)}
.sw.on i::after{left:20px;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);padding:0 15px;border-radius:var(--r-sm);
  border:var(--bw) solid var(--line);background:var(--surface2);cursor:pointer;font-size:var(--fs-sm);font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 10px;font-size:var(--fs-xs)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- results ---------- */
.results{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.res{border:var(--bw) solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,var(--surface2),var(--surface));padding:12px 13px;position:relative;overflow:hidden;
  animation:pop .38s cubic-bezier(.2,.8,.2,1) both}
.res::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dim2)}
.res.ok::before{background:var(--ok)} .res.warn::before{background:var(--warn)} .res.bad::before{background:var(--bad)} .res.info::before{background:var(--info)}
.res.big{grid-column:span 2}
@media(max-width:620px){.res.big{grid-column:span 1}}
.res .rl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.res .rv{font-size:clamp(22px,3.4vw,31px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:3px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.res.big .rv{font-size:clamp(28px,4.6vw,42px)}
.res .rv u{text-decoration:none;font-size:13px;font-weight:600;color:var(--dim)}
.res .rn{font-size:11px;color:var(--dim);margin-top:5px}
.res.ok .rv{color:var(--ink)} .res.warn .rv{color:var(--warn)} .res.bad .rv{color:var(--bad)} .res.info .rv{color:var(--info)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.trust{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:var(--r-sm);border:var(--bw) solid var(--line);font-size:var(--fs-sm);background:var(--surface2)}
.trust.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:color-mix(in srgb,var(--ok) 11%,var(--surface2))}
.trust.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line));background:color-mix(in srgb,var(--warn) 12%,var(--surface2))}
.trust.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line));background:color-mix(in srgb,var(--bad) 13%,var(--surface2))}
.trust b{font-weight:700}
.trust .ic{width:20px;height:20px;flex:0 0 auto}
.limits{display:grid;gap:6px}
.lim{display:flex;gap:8px;font-size:var(--fs-xs);color:var(--warn);align-items:flex-start}
.lim svg{width:14px;height:14px;flex:0 0 auto;margin-top:2px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.tbl th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:7px 9px;border-bottom:var(--bw) solid var(--line2);white-space:nowrap;position:sticky;top:0;background:var(--surface);z-index:2}
.tbl td{padding:7px 9px;border-bottom:var(--bw) solid var(--line);white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{max-height:340px;overflow:auto;border-radius:var(--r-sm);border:var(--bw) solid var(--line)}
.tbl input{width:100%;min-width:64px;background:var(--surface2);border:var(--bw) solid var(--line);border-radius:6px;padding:5px 7px;outline:none;min-height:34px}
.tbl input:focus{border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border-radius:99px;border:var(--bw) solid var(--line2);color:var(--dim)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}

/* ---------- charts ---------- */
.chartbox{position:relative;border:var(--bw) solid var(--line);border-radius:var(--r);background:
  radial-gradient(120% 100% at 50% 0%,var(--surface2),var(--surface));overflow:hidden;touch-action:none}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox .cursor{cursor:crosshair}
.chartlegend{display:flex;flex-wrap:wrap;gap:8px;padding:9px 12px;border-top:var(--bw) solid var(--line);font-size:var(--fs-xs)}
.chartlegend span{display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
.chartlegend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chartlegend button{background:none;border:0;cursor:pointer;color:inherit;display:inline-flex;align-items:center;gap:6px;padding:2px 4px;border-radius:6px}
.chartlegend button.off{opacity:.35;text-decoration:line-through}
.chartlegend button:hover{color:var(--ink)}
.readout{position:absolute;top:10px;right:10px;background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:var(--bw) solid var(--line2);border-radius:var(--r-sm);padding:8px 10px;font-size:var(--fs-xs);pointer-events:none;box-shadow:var(--shadow);min-width:130px}
.readout b{color:var(--accent)}
.readout .rr{display:flex;justify-content:space-between;gap:12px}
.ctrls{display:grid;gap:10px}
.ctrlrow{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:10px}
.ctrlrow>span{font-size:var(--fs-xs);color:var(--dim)}
.ctrlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* ---------- docs ---------- */
.doc{display:grid;gap:10px}
.doc .dr{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;font-size:var(--fs-sm)}
.doc .dr>span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2);padding-top:3px}
.formula{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:var(--fs-sm);background:var(--surface2);
  border:var(--bw) solid var(--line);border-left:3px solid var(--cyan);border-radius:var(--r-sm);padding:10px 12px;overflow-x:auto;white-space:pre-wrap;line-height:1.7}
.src{font-size:var(--fs-xs);color:var(--info)}
@media(max-width:640px){.doc .dr{grid-template-columns:1fr}.doc .dr>span{padding-top:0}}

/* ---------- home ---------- */
.hero{position:relative;border:var(--bw) solid var(--line);border-radius:20px;overflow:hidden;padding:26px 24px;
  background:linear-gradient(135deg,var(--petrol-600),var(--surface) 55%,var(--surface2));box-shadow:var(--shadow)}
html[data-theme="day"] .hero{background:linear-gradient(135deg,#fff6e6,var(--surface) 55%,var(--surface2))}
html[data-theme="field"] .hero{background:#000;border-width:2px}
.hero .glow{position:absolute;right:-60px;top:-90px;width:340px;height:340px;border-radius:99px;
  background:radial-gradient(circle,color-mix(in srgb,var(--amber) 45%,transparent),transparent 68%);filter:blur(26px);opacity:.6}
.hero h2{margin:0;font-size:clamp(24px,4vw,38px);letter-spacing:-.03em;line-height:1.08;font-weight:800;position:relative}
.hero p{margin:9px 0 0;color:var(--ink2);max-width:64ch;position:relative;font-size:var(--fs-sm)}
.hero .stats{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;position:relative}
.stat{border:var(--bw) solid var(--line2);border-radius:11px;padding:8px 12px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.stat b{display:block;font-size:19px;font-weight:800;color:var(--accent)}
.stat span{font-size:10px;color:var(--dim);letter-spacing:.06em}
.tiles{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(224px,1fr))}
.tile{text-align:left;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--surface);padding:13px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.tile:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--glow)}
.tile .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface3);color:var(--accent);margin-bottom:9px}
.tile .ti svg{width:18px;height:18px}
.tile b{display:block;font-size:var(--fs-sm);font-weight:700}
.tile small{display:block;color:var(--dim);font-size:var(--fs-xs);margin-top:3px;line-height:1.45}
.tile .tg{position:absolute;top:10px;right:10px;font-size:9px;color:var(--dim2);border:var(--bw) solid var(--line);padding:1px 5px;border-radius:5px}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:80;background:var(--surface);
  border-left:var(--bw) solid var(--line2);box-shadow:-30px 0 60px -30px rgba(0,0,0,.8);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(2px)}
.scrim.on{opacity:1;pointer-events:auto}
.dh{display:flex;align-items:center;gap:9px;padding:13px 14px;border-bottom:var(--bw) solid var(--line);background:var(--surface2)}
.dh h3{margin:0;font-size:var(--fs);font-weight:750}
.db{flex:1;overflow-y:auto;padding:13px 14px 30px;display:grid;gap:11px;align-content:start}
.df{padding:11px 14px;border-top:var(--bw) solid var(--line);background:var(--surface2);display:flex;gap:8px;flex-wrap:wrap}
.entry{border:var(--bw) solid var(--line);border-radius:var(--r-sm);background:var(--surface2);padding:10px 11px;cursor:pointer;transition:.14s;position:relative}
.entry:hover{border-color:var(--accent)}
.entry.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface2))}
.entry.drag{opacity:.4}
.entry .et{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);font-weight:650}
.entry .em{font-size:10.5px;color:var(--dim);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap}
.entry .ev{font-size:var(--fs-xs);color:var(--ink2);margin-top:6px;font-family:ui-monospace,Consolas,monospace}
.entry .cbx{width:20px;height:20px;border-radius:5px;border:var(--bw) solid var(--line2);display:grid;place-items:center;flex:0 0 auto;background:var(--surface)}
.entry.sel .cbx{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grip{cursor:grab;color:var(--dim2);font-size:14px;line-height:1;user-select:none}
.empty{text-align:center;padding:34px 16px;color:var(--dim);font-size:var(--fs-sm)}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:10px}

/* ---------- palette ---------- */
.pal{position:fixed;inset:0;z-index:95;display:none;padding:12vh 16px 16px;background:var(--scrim);backdrop-filter:blur(6px)}
.pal.open{display:block;animation:fade .16s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.palbox{max-width:620px;margin:0 auto;background:var(--surface);border:var(--bw) solid var(--line2);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:rise .22s both}
.palbox input{width:100%;height:56px;border:0;border-bottom:var(--bw) solid var(--line);background:var(--surface2);padding:0 16px;outline:none;font-size:16px}
.pallist{max-height:52vh;overflow-y:auto;padding:7px}
.palitem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-sm)}
.palitem.on{background:color-mix(in srgb,var(--accent) 18%,var(--surface2));color:var(--ink)}
.palitem small{margin-left:auto;color:var(--dim2);font-size:10px}
.palitem .pi{width:20px;color:var(--accent);display:grid;place-items:center}
.palitem .pi svg{width:16px;height:16px}

/* ---------- toasts ---------- */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;width:min(460px,calc(100% - 28px))}
.toast{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:var(--r-sm);border:var(--bw) solid var(--line2);
  background:var(--surface);box-shadow:var(--shadow);font-size:var(--fs-sm);animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.toast.ok{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.toast.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.toast .tu{margin-left:auto}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- mobile ---------- */
.mob{display:none}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:60px;bottom:0;width:270px;z-index:75;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--surface)}
  .rail.open{transform:none}
  main{padding:16px 14px 96px}
  .brand span{display:none}
  .kbd{display:none}
  #q{padding-right:14px}
  .mob{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:65;height:62px;align-items:stretch;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border-top:var(--bw) solid var(--line)}
  html[data-theme="field"] .mob{background:#000}
  .mob button{flex:1;display:grid;place-items:center;gap:2px;background:none;border:0;cursor:pointer;color:var(--dim);font-size:9.5px;padding:6px 2px}
  .mob button.on{color:var(--accent)}
  .mob svg{width:20px;height:20px}
  .badgechk span{display:none}
  .topbtns .hide-sm{display:none}
}
@media(max-width:520px){
  .results{grid-template-columns:1fr}
  .head .acts{width:100%}
  .ctrlrow{grid-template-columns:1fr}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,Consolas,monospace}
.mut{color:var(--dim)}
.acc{color:var(--accent)}
.sep{height:var(--bw);background:var(--line);border:0;margin:2px 0}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="mesh"></div><div class="aurora"></div><div class="lines"></div><div class="grain"></div></div>

<header class="top">
  <button class="brand" id="brand" title="На главную">
    <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--amber)"/><stop offset=".55" stop-color="var(--cyan)"/><stop offset="1" stop-color="var(--acid)"/>
      </linearGradient></defs>
      <rect x="1.5" y="1.5" width="37" height="37" rx="11" stroke="url(#bg1)" stroke-width="2.4"/>
      <path d="M20 8c5 6.6 8 10.9 8 14.6A8 8 0 0 1 12 22.6C12 18.9 15 14.6 20 8Z" fill="url(#bg1)" opacity=".92"/>
      <path d="M9 31h22" stroke="var(--amber)" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <span style="display:block"><b>ТЕЧЕТ&nbsp;01</b><span>ПОДРУЧНЫЙ РАСЧЁТ</span></span>
  </button>
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Поиск: nps, итк, rvp, метанол…" autocomplete="off" spellcheck="false" aria-label="Командная навигация">
    <span class="kbd"><i>Ctrl</i><i>K</i></span>
  </div>
  <div class="topbtns">
    <button class="badgechk" id="chkBadge" title="Самопроверка эталонов"><span class="dot"></span><span>Эталоны</span>&nbsp;<b id="chkTxt">—</b></button>
    <button class="iconbtn hide-sm" id="thDay" title="Дневная тема" aria-label="Дневная тема"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg></button>
    <button class="iconbtn" id="thNight" title="Ночная тема" aria-label="Ночная тема"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg></button>
    <button class="iconbtn" id="thField" title="Улица / солнце / перчатки" aria-label="Высококонтрастный режим"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></svg></button>
    <button class="iconbtn" id="btnProto" title="Протокол смены" aria-label="Протокол смены"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg></button>
    <button class="iconbtn" id="btnMenu" title="Калькуляторы" aria-label="Меню" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>

<nav class="mob" id="mob"></nav>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Протокол смены"></aside>
<div class="pal" id="pal"><div class="palbox"><input id="palQ" placeholder="Куда перейти? nps / итк / rvp / метанол" autocomplete="off" spellcheck="false"><div class="pallist" id="palList"></div></div></div>
<div class="toasts" id="toasts"></div>

function fromBase(g,x,u){
  if(!isN(x))return NaN;

    return x/UG.KV.f[u];
  }
  return x/UG[g].f[u];
}
const uKeys=g=>Object.keys(UG[g].f);

/* ==========================================================================

   ========================================================================== */
/* Антуан: log10(P[бар]) = A − B/(T[K]+C). Источник: NIST Chemistry WebBook. */

 {id:"hexane",n:"н-Гексан",A:4.00266,B:1171.53,C:-48.784,tmin:286.2,tmax:342.7,M:86.18},

function donut(parts,size){
  const R=(size||150)/2,r=R*0.62,cx=R,cy=R;
  const tot=parts.reduce((s,p)=>s+Math.max(0,p.v),0)||1;let a=-Math.PI/2,s="";
  s+='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(2*R)+' '+(2*R)+'">';
  parts.forEach((p,i)=>{
    const f=Math.max(0,p.v)/tot,b=a+f*2*Math.PI;
    if(f<=0)return;
    const large=(b-a)>Math.PI?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b);
    const X1=cx+R*.94*Math.cos(a),Y1=cy+R*.94*Math.sin(a),X2=cx+R*.94*Math.cos(b),Y2=cy+R*.94*Math.sin(b);
    s+='<path d="M'+x1+' '+y1+' L'+X1+' '+Y1+' A'+(R*.94)+' '+(R*.94)+' 0 '+large+' 1 '+X2+' '+Y2+' L'+x2+' '+y2+' A'+r+' '+r+' 0 '+large+' 0 '+x1+' '+y1+' Z" fill="'+(p.c||col(i))+'" opacity=".92"/>';
    if(f>0.055){const m=(a+b)/2,rr=(r+R*.94)/2;
      s+='<text x="'+(cx+rr*Math.cos(m))+'" y="'+(cy+rr*Math.sin(m)+3.5)+'" font-size="10.5" font-weight="700" text-anchor="middle" fill="'+cv("--bg")+'">'+Math.round(f*100)+'%</text>';}
    a=b;
  });
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-1)+'" fill="'+cv("--surface")+'"/>';
  s+='</svg>';return s;
}
function barsH(items,w){
  const W=w||640,rowH=30,H=items.length*rowH+16,PL=140,max=Math.max(1e-9,...items.map(i=>Math.abs(i.v)));
  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'">';
  items.forEach((it,i)=>{
    const y=8+i*rowH,bw=Math.abs(it.v)/max*(W-PL-70);
    s+='<text x="'+(PL-8)+'" y="'+(y+15)+'" font-size="11" text-anchor="end" fill="'+cv("--dim")+'">'+esc(it.n)+'</text>';
    s+='<rect x="'+PL+'" y="'+(y+4)+'" width="'+(W-PL-70)+'" height="16" rx="5" fill="'+cv("--surface3")+'"/>';
    s+='<rect x="'+PL+'" y="'+(y+4)+'" width="'+Math.max(2,bw)+'" height="16" rx="5" fill="'+(it.c||col(i))+'" opacity=".9"/>';
    s+='<text x="'+(PL+bw+7)+'" y="'+(y+16)+'" font-size="11" fill="'+cv("--ink2")+'">'+esc(it.t||fmt(it.v))+'</text>';
  });
  return s+"</svg>";
}

/* ---------- P0-2 Давление насыщенных паров ---------- */
def({id:"psat",group:"Карман",p:"P0",icon:"psat",title:"Давление насыщенных паров",
 short:"Антуан + номограммы Кокса и Максвелла, ДНП дизтоплива",
 tags:["антуан","давление паров","pнас","кокс","максвелл","днп","rvp","летучесть"],
 fields:[
  F("comp","Компонент",{kind:"sel",val:"hexane",opts:()=>ANTOINE.map(c=>({v:c.id,t:c.n}))}),
  F("t","Температура",{val:60,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("mode","График",{kind:"sel",val:"cox",opts:[{v:"cox",t:"Номограмма Кокса"},{v:"max",t:"Номограмма Максвелла"},{v:"curve",t:"Кривая P(T)"}]}),
  F("t50","ДТ: T 50 % (Д86)",{val:260,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("rho","ДТ: плотность ρ15",{val:840,unit:"кг/м³",units:["кг/м³","г/см³","°API"],g:"DENS",step:1})
 ],
 doc:{in:"Компонент и температура; для дизтоплива — T 50 % по Д86 и ρ15.",
  out:"Pнас (кПа, бар, мм рт.ст., кгс/см²), температура кипения при 101.325 кПа, оценка ДНП дизтоплива.",
  formula:"log10(P[бар]) = A − B/(T[K] + C)   (Антуан)\nШкала Кокса: ось X ∝ 1/(T[K] − 43), ось Y = log10 P\nДНП ДТ (оценка): P[кПа] ≈ 10^(4.3 − 1900/(T50[K])) · (840/ρ15)",
  assum:"Антуан справедлив только в указанном интервале T. Номограмма Максвелла построена по Клапейрону–Клаузиусу с правилом Трутона (ΔHисп ≈ 88·Tb) — оценка для нефтяных фракций, не для чистых веществ.",
  limits:"Вне интервала Антуана результат помечается как экстраполяция. ДНП ДТ — прикидка ±25 %, арбитраж — лаборатория по ГОСТ 31873 / ASTM D5191.",
  src:"NIST Chemistry WebBook (константы Антуана); справочник нефтепереработки, номограммы Кокса и Максвелла."},
 compute(V,R){
  const c=antById(R.comp),TK=V.t+273.15,P=ant(c,TK);
  const out=(TK<c.tmin||TK>c.tmax);
  const tb=bisect(T=>ant(c,T)-101.325,c.tmin-40,c.tmax+120,1e-7);
  const dnp=Math.pow(10,4.3-1900/(V.t50+273.15))*(840/Math.max(V.rho,400));
  const cards=[
   {l:"P насыщенных паров",v:fmt(P,2),u:"кПа",st:out?"warn":"ok",big:true,note:c.n+", "+fmt(V.t,1)+" °C"},
   {l:"В мм рт.ст.",v:fmt(P/0.1333224,1),u:"мм рт.ст.",st:"info"},
   {l:"В бар / кгс/см²",v:fmt(P/100,4)+" / "+fmt(P/98.0665,4),u:"бар / кгс",st:"info"},
   {l:"T кипения при 1 атм",v:isN(tb)?fmt(tb-273.15,1):"—",u:"°C",st:"info"},
   {l:"ДНП дизтоплива (оценка)",v:fmt(dnp,1),u:"кПа",st:dnp>90?"warn":"ok",note:"лето ≤ 90 кПа · зима ≤ 100 кПа (ориентир)"}
  ];
  const lim=[];
  if(out)lim.push("T вне интервала Антуана "+fmt(c.tmin-273.15,0)+"…"+fmt(c.tmax-273.15,0)+" °C — экстраполяция, точность не гарантируется.");
  if(P>1000)lim.push("P > 1 МПа: Антуан для лёгких углеводородов у критической точки теряет точность.");
  /* --- графики --- */
  const N=clamp(S.chart.quality,40,400),zm=S.chart.zoom;
  let inner="",legend="",hint="",meta=null;
  if(R.mode==="curve"){
    const a=Math.max(c.tmin-273.15,-60),b=Math.min(c.tmax-273.15+30,320);
    const pts=[];for(let i=0;i<=N;i++){const t=lerp(a,b,i/N);pts.push([t,ant(c,t+273.15)]);}
    const ymax=Math.max(120,ant(c,b+273.15))/zm;
    const p=plot({x:[a,b],y:[0,ymax],series:[{pts:pts,color:col(0),area:true,name:c.n}],
      xl:"Температура, °C",yl:"P, кПа",extra:'<line x1="'+0+'" y1="0" x2="0" y2="0"/>'});
    const cx=p.X(V.t),cy=p.Y(clamp(P,0,ymax));
    p.svg=p.svg.replace("</svg>",'<line x1="'+cx+'" y1="'+p.PT+'" x2="'+cx+'" y2="'+(p.PT+p.ih)+'" stroke="'+cv("--cyan")+'" stroke-width="1.4" stroke-dasharray="4 4"/>'
      +'<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="'+cv("--cyan")+'" opacity=".9"/>'
      +'<text x="'+(cx+9)+'" y="'+(cy-8)+'" font-size="11.5" font-weight="700" fill="'+cv("--cyan")+'">'+fmt(P,1)+' кПа</text></svg>');
    inner=p.svg;meta={kind:"lin",p:p};legend='<span><i style="background:'+col(0)+'"></i>'+c.n+'</span><span><i style="background:'+cv("--cyan")+'"></i>рабочая точка (тяните по графику)</span>';
    hint="Тяните пальцем/мышью по полю — рабочая точка и Pнас пересчитываются мгновенно.";
  } else if(R.mode==="cox"){
    const comps=["water","pentane","hexane","heptane","octane","benzene","toluene"];
    const cxT=t=>1/(t+273.15-43);
    const xa=cxT(320),xb=cxT(-20);
    const series=comps.map((id,i)=>{const cc=antById(id),pts=[];
      const lo=Math.max(cc.tmin-273.15,-20),hi=Math.min(cc.tmax-273.15,320);
      for(let j=0;j<=Math.round(N/2);j++){const t=lerp(lo,hi,j/Math.round(N/2));
        pts.push([cxT(t),Math.log10(Math.max(ant(cc,t+273.15),1e-6))]);}
      return {pts:pts,color:col(i),name:S.chart.labels?cc.n:"",width:S.chart.stroke};});
    const yr=[-3.2,3.4];const span=(yr[1]-yr[0])/zm,mid=(yr[0]+yr[1])/2;
    const p=plot({x:[xa,xb],y:[mid-span/2,mid+span/2],series:series,xl:"шкала Кокса  ∝ 1/(T−43)",yl:"log10 P [кПа]",
      fmtX:v=>fmt(1/v+43-273.15,0),fmtY:v=>fmt(Math.pow(10,v),Math.pow(10,v)<10?2:0)});
    const cxp=p.X(cxT(V.t));
    let ex='<line x1="'+cxp+'" y1="'+p.PT+'" x2="'+cxp+'" y2="'+(p.PT+p.ih)+'" stroke="'+cv("--ink")+'" stroke-width="1.6"/>';
    let ro='<div class="readout"><div class="rr"><span>T</span><b>'+fmt(V.t,1)+' °C</b></div>';
    comps.slice(0,5).forEach((id,i)=>{const cc=antById(id),Pp=ant(cc,V.t+273.15);
      const yy=p.Y(Math.log10(Math.max(Pp,1e-6)));
      if(yy>p.PT&&yy<p.PT+p.ih)ex+='<circle cx="'+cxp+'" cy="'+yy+'" r="4.5" fill="'+col(i)+'" stroke="'+cv("--surface")+'" stroke-width="1.4"/>';
      ro+='<div class="rr"><span style="color:'+col(i)+'">'+esc(cc.n)+'</span><b>'+fmt(Pp,1)+'</b></div>';});
    ro+="</div>";
    p.svg=p.svg.replace("</svg>",ex+"</svg>");
    inner=p.svg+ro;meta={kind:"cox",p:p,cxT:cxT};
    legend=comps.map((id,i)=>'<span><i style="background:'+col(i)+'"></i>'+antById(id).n+'</span>').join("");
    hint="Номограмма Кокса: прямые почти сходятся в одну точку — так в справочниках читают Pнас без расчёта. Тяните вертикаль.";
  } else {
    /* Максвелл: семейство P(T) для фракций с Tb 60…360 °C, «линейка» с двумя ручками */
    const tbs=[80,140,200,260,320,360];
    const maxP=(T,Tb)=>{const Tk=T+273.15,Tbk=Tb+273.15,dH=88*Tbk;
      return 101.325*Math.exp(-dH/8.314462618*(1/Tk-1/Tbk));};
    const a=-20,b=340,series=tbs.map((Tb,i)=>{const pts=[];
      for(let j=0;j<=N;j++){const t=lerp(a,b,j/N);pts.push([t,Math.log10(Math.max(maxP(t,Tb),1e-5))]);}
      return {pts:pts,color:col(i),name:S.chart.labels?("Tb "+Tb+"°"):"",width:S.chart.stroke};});
    const yr=[-3,2.6],span=(yr[1]-yr[0])/zm,mid=(yr[0]+yr[1])/2;
    const p=plot({x:[a,b],y:[mid-span/2,mid+span/2],series:series,xl:"T, °C",yl:"log10 P [кПа]",
      fmtY:v=>fmt(Math.pow(10,v),Math.pow(10,v)<10?2:0)});
    CH.maxHandles=CH.maxHandles||{a:[20,-1.2],b:[300,1.9]};
    const A=CH.maxHandles.a,B=CH.maxHandles.b;
    const ax=p.X(A[0]),ay=p.Y(A[1]),bx=p.X(B[0]),by=p.Y(B[1]);
    let ex='<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" stroke="'+cv("--ink")+'" stroke-width="2"/>'
      +'<circle cx="'+ax+'" cy="'+ay+'" r="8" fill="'+cv("--amber")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>'
      +'<circle cx="'+bx+'" cy="'+by+'" r="8" fill="'+cv("--cyan")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
    const hits=[];
    tbs.forEach((Tb,i)=>{
      const pts=series[i].pts;
      for(let j=1;j<pts.length;j++){
        const x1=p.X(pts[j-1][0]),y1=p.Y(pts[j-1][1]),x2=p.X(pts[j][0]),y2=p.Y(pts[j][1]);
        const d=(bx-ax)*(y2-y1)-(by-ay)*(x2-x1);if(Math.abs(d)<1e-9)continue;
        const t=((x1-ax)*(y2-y1)-(y1-ay)*(x2-x1))/d, u=((x1-ax)*(by-ay)-(y1-ay)*(bx-ax))/d;
        if(t>=0&&t<=1&&u>=0&&u<=1){

    if(!hits.length)ro+='<div class="rr"><span>нет пересечений</span></div>';
    ro+="</div>";
    p.svg=p.svg.replace("</svg>",ex+"</svg>");
    inner=p.svg+ro;meta={kind:"max",p:p};
    legend=tbs.map((t,i)=>'<span><i style="background:'+col(i)+'"></i>Tb '+t+' °C</span>').join("");
    hint="Тяните жёлтую и голубую ручки — «линейка» ложится на семейство кривых, пересечения читаются справа. Оценка по правилу Трутона.";
  }
  return {cards:cards,limits:lim,chart:{title:R.mode==="cox"?"Номограмма Кокса":R.mode==="max"?"Номограмма Максвелла (фракции)":"Кривая Pнас(T)",
    inner:inner,legend:legend,hint:hint,meta:meta,random:true}};
 },
 checks:[{n:"Вода 100 °C → 101.3 кПа",exp:101.3,tol:2.5,f:()=>ant(antById("water"),373.15)},

/* ---------- P0-3 Плотность по температуре ---------- */
def({id:"rho",group:"Карман",p:"P0",icon:"rho",title:"Плотность по температуре",
 short:"ГОСТ 3900 (линейно) и ASTM D1298/D1250 (экспоненциально)",
 tags:["плотность","гост 3900","astm d1298","d1250","api","температурная поправка","относительная"],
 fields:[
  F("r","Плотность при 20 °C",{val:850,unit:"кг/м³",units:["кг/м³","г/см³","°API","SG 60/60"],g:"DENS",step:1}),
  F("t","Рабочая температура",{val:60,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("cls","Класс продукта (ASTM)",{kind:"sel",val:"diesel",opts:()=>Object.keys(ASTM_K).map(k=>({v:k,t:ASTM_K[k][2]}))}),
  F("m","Масса партии",{val:1200,unit:"т/ч",units:["т/ч","кг/ч","т/сут"],g:"MASS",step:1})
 ],
 doc:{in:"ρ20 (или ρ15 для ASTM), рабочая T, класс продукта, массовый расход.",
  out:"ρ при рабочей T по двум методам, °API, SG 60/60, объёмный расход партии, расхождение методов.",
  formula:"ГОСТ 3900:  ρt = ρ20 − γ·(t − 20)\nASTM D1250: ρt = ρ15·exp[−α·ΔT·(1 + 0.8·α·ΔT)],  α = (K0 + K1·ρ15)/ρ15²\n°API = 141.5/SG − 131.5;  SG = ρ15/999.016\nQv = Qm / ρt",
  assum:"γ берётся из таблицы средних температурных коэффициентов по интервалу ρ20. Для ASTM ρ20 приведена к ρ15 обратной итерацией.",
  limits:"ГОСТ-таблица: ρ20 = 690…1000 кг/м³. ASTM: ΔT = −20…+150 °C от 15 °C. Вне диапазона — предупреждение.",
  src:"ГОСТ 3900-85; ASTM D1298 / D1250 (API MPMS Ch.11.1)."},
 compute(V,R){
  const g=gammaOf(V.r),rhoG=V.r-g*(V.t-20);

/* ---------- P1-6 Разбивка ИТК ---------- */
function parsePairs(txt){
  const out=[];String(txt||"").split(/[\n;]+/).forEach(l=>{
    const m=l.split(/[\s,;\t]+/).filter(Boolean);if(m.length<2)return;
    const a=num(m[0]),b=num(m[1]);if(isN(a)&&isN(b))out.push([a,b]);});
  out.sort((x,y)=>x[0]-y[0]);return out;
}
function itkAt(pts,T){
  if(!pts.length)return NaN;
  if(T<=pts[0][0])return pts[0][1];
  if(T>=pts[pts.length-1][0])return pts[pts.length-1][1];
  for(let i=1;i<pts.length;i++)if(T<=pts[i][0]){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return lerp(y0,y1,(T-x0)/((x1-x0)||1));}
  return pts[pts.length-1][1];
}
function itkInv(pts,Y){
  if(!pts.length)return NaN;
  if(Y<=pts[0][1])return pts[0][0];
  if(Y>=pts[pts.length-1][1])return pts[pts.length-1][0];
  for(let i=1;i<pts.length;i++)if(Y<=pts[i][1]){
    const [x0,y0]=pts[i-1],[x1,y1]=pts[i];return lerp(x0,x1,(Y-y0)/((y1-y0)||1));}
  return pts[pts.length-1][0];
}
def({id:"itk",group:"Фракции",p:"P1",icon:"itk",title:"Разбивка ИТК на узкие фракции",
 short:"Псевдокомпоненты: Tср, ρ, M, UOP K → мост в конструктор НПЗ",
 tags:["итк","тбп","псевдокомпоненты","фракции","узкие фракции","watson","уотсон","мост","нпз","риази"],
 fields:[
  F("tbl","ИТК: T °C — выход % масс.",{kind:"area",val:ITK_SEED.map(p=>p[0]+"  "+p[1]).join("\n")}),
  F("n","Число узких фракций",{kind:"range",val:12,min:5,max:30,step:1}),
  F("rhoBulk","ρ20 нефти",{val:855,unit:"кг/м³",units:["кг/м³","г/см³","°API"],g:"DENS",step:1}),
  F("rhoLight","ρ20 первой фракции",{val:700,step:1}),
  F("rhoHeavy","ρ20 последней фракции",{val:945,step:1}),
  F("mwModel","Модель M",{kind:"sel",val:"rd",opts:[{v:"rd",t:"Riazi–Daubert"},{v:"kl",t:"Kesler–Lee"}]}),
  F("normalize","Нормировать ρ к ρ20 нефти",{kind:"bool",val:true})
 ],
 doc:{in:"Таблица ИТК (температура — накопленный выход), число фракций, ρ20 нефти и граничные плотности.",
  out:"Таблица псевдокомпонентов: границы, Tср, выход %, ρ20, SG, M, UOP K; файл-мост JSON/CSV для конструктора НПЗ.",
  formula:"Границы по равному выходу: Yk = Ymin + k·(Ymax−Ymin)/N;  Tk = ИТК⁻¹(Yk)\nTср = (Tk + Tk+1)/2;  ρk = ρL + (ρH − ρL)·(Tср − Tср,min)/(Tср,max − Tср,min)\nнормировка: ρk *= ρнефть / Σ(wk·ρk)\nM(RD) = 4.5673·10⁻⁵·Tb[°R]^2.1962·SG^−1.0164;  K = (1.8·Tb[K])^⅓ / SG",
  assum:"Плотность фракции линейна по Tср между заданными граничными значениями; при нормировке массово-средняя плотность совпадает с ρ20 нефти.",
  limits:"ИТК должна быть монотонной. M по RD надёжна при M ≳ 100 г/моль (лёгкие фракции завышаются), Kesler–Lee — альтернатива. UOP K вне 10…13 требует проверки данных.",
  src:"Riazi & Daubert (1980); Kesler & Lee (1976); Watson & Nelson (UOP K); API Technical Data Book Ch.2."},
 compute(V,R){
  const pts=parsePairs(R.tbl);
  if(pts.length<2)return {cards:[{l:"Нет данных",v:"—",st:"bad",note:"Нужно ≥ 2 строки «T выход»"}],limits:["Введите ИТК: две колонки, T °C и накопленный выход %."]};
  const N=clamp(Math.round(V.n),5,30),y0=pts[0][1],y1=pts[pts.length-1][1];
  const cuts=[];
  for(let k=0;k<N;k++){
    const ya=lerp(y0,y1,k/N),yb=lerp(y0,y1,(k+1)/N);
    const ta=itkInv(pts,ya),tb=itkInv(pts,yb);
    cuts.push({i:k+1,ta:ta,tb:tb,tm:(ta+tb)/2,w:(yb-ya)/100});
  }
  const tmin=cuts[0].tm,tmax=cuts[cuts.length-1].tm;
  cuts.forEach(c=>{c.rho=lerp(V.rhoLight,V.rhoHeavy,(c.tm-tmin)/((tmax-tmin)||1));});
  if(R.normalize){const avg=cuts.reduce((s,c)=>s+c.w*c.rho,0)/cuts.reduce((s,c)=>s+c.w,0);
    const k=V.rBulk/avg;cuts.forEach(c=>{c.rho*=k;});}
  cuts.forEach(c=>{c.sg=sgOf(c.rho);c.mw=R.mwModel==="kl"?mwKL(c.tm+273.15,c.sg):mwRD(c.tm+273.15,c.sg);
    c.K=watsonK(c.tm+273.15,c.sg);});
  const wsum=cuts.reduce((s,c)=>s+c.w,0);
  const mwAvg=cuts.reduce((s,c)=>s+c.w*c.mw,0)/wsum;
  const kAvg=cuts.reduce((s,c)=>s+c.w*c.K,0)/wsum;
  const N2=clamp(S.chart.quality,40,400);
  const curve=[];for(let i=0;i<=N2;i++){const t=lerp(pts[0][0],pts[pts.length-1][0],i/N2);curve.push([t,itkAt(pts,t)]);}
  const p=plot({x:[pts[0][0],pts[pts.length-1][0]],y:[0,Math.max(100,y1*1.05)/S.chart.zoom],
    series:[{pts:curve,color:col(0),name:"ИТК",area:true}],xl:"T, °C",yl:"накопленный выход, %"});
  let ex="";cuts.forEach((c,i)=>{const xa=p.X(c.ta),xb=p.X(c.tb);
    ex+='<rect x="'+xa+'" y="'+p.PT+'" width="'+Math.max(1,xb-xa)+'" height="'+p.ih+'" fill="'+col(i%8)+'" opacity="'+(i%2?.10:.05)+'"/>';
    ex+='<line x1="'+xb+'" y1="'+p.PT+'" x2="'+xb+'" y2="'+(p.PT+p.ih)+'" stroke="'+col(i%8)+'" stroke-width="1" opacity=".55"/>';});
  pts.forEach(pt=>{ex+='<circle cx="'+p.X(pt[0])+'" cy="'+p.Y(pt[1])+'" r="3.6" fill="'+cv("--surface")+'" stroke="'+col(0)+'" stroke-width="1.6"/>';});
  p.svg=p.svg.replace("</svg>",ex+"</svg>");
  const lim=[];
  if(Math.abs(wsum*100-(y1-y0))>0.5)lim.push("Сумма выходов фракций "+fmt(wsum*100,2)+" % ≠ диапазон ИТК "+fmt(y1-y0,2)+" %.");
  if(cuts.some(c=>c.K<9.5||c.K>13.5))lim.push("Есть фракции с UOP K вне 9.5…13.5 — проверьте плотности/ИТК.");
  if(cuts.some(c=>c.mw<70))lim.push("Есть фракции с M < 70 г/моль — корреляции для лёгких концов занижают/завышают M, сверьте с известными компонентами.");
  const rows=cuts.map(c=>["№"+c.i,fmt(c.ta,1)+"…"+fmt(c.tb,1),fmt(c.tm,1),fmt(c.w*100,2),fmt(c.rho,1),fmt(c.sg,4),fmt(c.mw,1),fmt(c.K,2)]);
  return {cards:[
   {l:"Псевдокомпонентов",v:String(N),u:"шт",st:"ok",big:true,note:"покрыто "+fmt(wsum*100,2)+" % массы нефти"},
   {l:"Средняя M",v:fmt(mwAvg,1),u:"г/моль",st:"info",note:R.mwModel==="kl"?"Kesler–Lee":"Riazi–Daubert"},
   {l:"Средний UOP K",v:fmt(kAvg,2),u:"—",st:kAvg>12.1?"ok":kAvg>11.5?"warn":"bad",
     note:kAvg>12.1?"парафиновая основа":kAvg>11.5?"промежуточная":"ароматизированная"},
   {l:"Диапазон Tср",v:fmt(tmin,0)+"…"+fmt(tmax,0),u:"°C",st:"info"}
  ],limits:lim,
  chart:{title:"ИТК и границы узких фракций",inner:p.svg,legend:'<span><i style="background:'+col(0)+'"></i>ИТК</span><span class="mut">полосы — границы фракций</span>',
    hint:"Ползунком «Число узких фракций» разбиение перестраивается мгновенно.",meta:{kind:"none"}},
  tables:[{title:"Псевдокомпоненты",head:["№","Границы, °C","Tср, °C","Выход, %","ρ20, кг/м³","SG","M, г/моль","UOP K"],rows:rows,num:[1,2,3,4,5,6,7]}],
  extra:'<div class="flex"><button class="btn pri" data-act="itkJson">'+svgi("dl")+'Мост в НПЗ · JSON</button>'
   +'<button class="btn" data-act="itkCsv">'+svgi("dl")+'CSV</button>'
   +'<button class="btn ghost" data-act="itkCopy">'+svgi("copy")+'Копировать таблицу</button></div>',
  bridge:cuts};
 },
 checks:[{n:"ИТК-интерполяция: середина",exp:50,tol:1e-9,f:()=>itkAt([[0,0],[100,100]],50)},
  {n:"ИТК-обратная: 50 % → 50 °C",exp:50,tol:1e-9,f:()=>itkInv([[0,0],[100,100]],50)},
  {n:"UOP K: Tb=366 K, SG=0.664",exp:12.13,tol:.06,f:()=>watsonK(366,.664)}]
});

/* ---------- P1-7 D86 ↔ TBP ---------- */
def({id:"d86",group:"Фракции",p:"P1",icon:"d86",title:"Д86 ↔ ИТК (TBP)",
 short:"Пересчёт по API / Риази–Доберту, сверка с лабораторией",
 tags:["d86","д86","astm","тбп","itk","итк","риази","доберт","лаборатория","гонка"],
 fields:[
  F("dir","Направление",{kind:"sel",val:"d2t",opts:[{v:"d2t",t:"Д86 → ИТК (TBP)"},{v:"t2d",t:"ИТК → Д86"}]}),
  F("p0","0 % (НК)",{val:45,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("p10","10 %",{val:95,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("p30","30 %",{val:145,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("p50","50 %",{val:200,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("p70","70 %",{val:255,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("p90","90 %",{val:310,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("p100","100 % (КК)",{val:345,unit:"°C",units:["°C","K","°F"],g:"T",step:1})
 ],
 doc:{in:"Семь точек фракционного состава (0/10/30/50/70/90/100 %) и направление пересчёта.",
  out:"Пересчитанная кривая, таблица обеих кривых и разностей, график сравнения.",
  formula:"T_TBP[K] = a · T_D86[K]^b   (по каждой точке своя пара a, b)\n0 %: 7.40120 / 0.60244 · 10 %: 4.90040 / 0.71644 · 30 %: 3.03050 / 0.80076\n50 %: 0.87180 / 1.02580 · 70 %: 0.52770 / 1.09000 · 90 %: 0.30800 / 1.18400 · 100 %: 0.25282 / 1.22000\nОбратно: T_D86 = (T_TBP/a)^(1/b)",
  assum:"Температуры в кельвинах. Коэффициенты API для атмосферной гонки Д86 (ASTM D86) нефтяных фракций.",
  limits:"Применимо к прямогонным нефтяным фракциям без разложения (T до ~370 °C). Для вакуумных остатков и треснувших продуктов погрешность растёт. Кривая должна быть монотонной.",
  src:"API Technical Data Book, procedure 3A1.1; Riazi & Daubert (1980); ASTM D86 / D2892."},
 compute(V,R){
  const P=[0,10,30,50,70,90,100],keys=["p0","p10","p30","p50","p70","p90","p100"];
  const src=keys.map(k=>V[k]);
  const conv=src.map((t,i)=>R.dir==="d2t"?d86toTBP(t,P[i]):tbptoD86(t,P[i]));
  const rows=P.map((p,i)=>[p+" %",fmt(src[i],1),fmt(conv[i],1),fmt(conv[i]-src[i],1)]);
  const N=clamp(S.chart.quality,40,400);
  const mk=arr=>{const out=[];for(let i=0;i<=N;i++){const y=lerp(0,100,i/N);
    let t=NaN;for(let j=1;j<P.length;j++)if(y<=P[j]){t=lerp(arr[j-1],arr[j],(y-P[j-1])/((P[j]-P[j-1])||1));break;}
    if(isN(t))out.push([t,y]);}return out;};
  const a=mk(src),b=mk(conv);
  const all=a.concat(b).map(p=>p[0]),lo=Math.min(...all)-12,hi=Math.max(...all)+12,span=(hi-lo)/S.chart.zoom,mid=(hi+lo)/2;
  const p=plot({x:[mid-span/2,mid+span/2],y:[0,100],series:[{pts:a,color:col(0),name:R.dir==="d2t"?"Д86":"ИТК"},{pts:b,color:col(1),dash:"6 4",name:R.dir==="d2t"?"ИТК":"Д86"}],
    xl:"T, °C",yl:"отгон, %"});
  const mono=src.every((t,i)=>i===0||t>=src[i-1]);
  const lim=[];if(!mono)lim.push("Кривая не монотонна — пересчёт физически недостоверен, проверьте точки.");
  if(Math.max(...src)>380)lim.push("T > 380 °C — атмосферная гонка идёт с разложением, коэффициенты API неприменимы.");
  return {cards:[
   {l:(R.dir==="d2t"?"ИТК":"Д86")+" 50 %",v:fmt(conv[3],1),u:"°C",st:mono?"ok":"bad",big:true,note:"исходная 50 % = "+fmt(src[3],1)+" °C"},
   {l:"Сдвиг 50 %",v:fmt(conv[3]-src[3],1),u:"°C",st:"info"},
   {l:"НК → "+(R.dir==="d2t"?"ИТК":"Д86"),v:fmt(conv[0],1),u:"°C",st:"info"},
   {l:"КК → "+(R.dir==="d2t"?"ИТК":"Д86"),v:fmt(conv[6],1),u:"°C",st:"info"}
  ],limits:lim,chart:{title:"Сравнение кривых",inner:p.svg,
    legend:'<span><i style="background:'+col(0)+'"></i>'+(R.dir==="d2t"?"Д86 (вход)":"ИТК (вход)")+'</span><span><i style="background:'+col(1)+'"></i>'+(R.dir==="d2t"?"ИТК (расчёт)":"Д86 (расчёт)")+'</span>',
    meta:{kind:"none"}},
  tables:[{title:"Точки кривых",head:["Отгон","Вход, °C","Расчёт, °C","Δ, °C"],rows:rows,num:[1,2,3]}]};
 },
 checks:[{n:"Д86 200 °C → ИТК 50 %",exp:210.6,tol:1.5,f:()=>d86toTBP(200,50)},
  {n:"Обратный пересчёт (round-trip)",exp:200,tol:.001,f:()=>tbptoD86(d86toTBP(200,50),50)},
  {n:"Д86 100 °C → ИТК 10 %",exp:68.1,tol:1.5,f:()=>d86toTBP(100,10)}]
});

/* ---------- P1-8 UOP K + номограмма ---------- */
def({id:"watson",group:"Фракции",p:"P1",icon:"watson",title:"Фактор Уотсона (UOP K)",
 short:"Тип нефти + интерактивная номограмма с линейкой",
 tags:["uop","watson","уотсон","k","фактор","парафинистая","ароматическая","номограмма"],
 fields:[
  F("tb","Средняя температура кипения",{val:280,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("rho","ρ15",{val:850,unit:"кг/м³",units:["кг/м³","г/см³","°API","SG 60/60"],g:"DENS",step:1}),
  F("basis","База Tср",{kind:"sel",val:"mol",opts:[{v:"mol",t:"мольная"},{v:"mass",t:"массовая"},{v:"vol",t:"объёмная"},{v:"cab",t:"кубическая"}]})
 ],
 doc:{in:"Средняя температура кипения (укажите базу) и плотность ρ15 / SG.",
  out:"UOP K, характеристика основы нефти, номограмма с подвижной линейкой и считыванием K.",
  formula:"K = (1.8 · Tb[K])^⅓ / SG60/60\nНомограмма: три логарифмические шкалы Tb — K — SG; прямая через Tb и SG пересекает шкалу K в искомом значении (тождество lg K = ⅓·lg(1.8Tb) − lg SG).",
  assum:"K классифицирует основу: > 12.5 парафиновая, 11.5…12.5 промежуточная (нафтеновая), < 11.5 ароматическая. Разные базы Tср дают K, отличающийся на 0.1…0.3.",
  limits:"Tb = 30…500 °C, SG = 0.60…1.10. Для смесей с олефинами и кислородсодержащими компонентами классификация теряет смысл.",
  src:"Watson, Nelson & Murphy (1935); API Technical Data Book Ch.2; справочные номограммы UOP."},
 compute(V,R){
  const SG=sgOf(V.rho),K=watsonK(V.tb+273.15,SG);
  const type=K>12.5?"Парафиновая основа":K>=11.5?"Промежуточная / нафтеновая":"Ароматизированная основа";
  /* номограмма: три параллельные шкалы */
  const W=760,H=400,PT=34,PB=34,ih=H-PT-PB,xL=120,xM=380,xR=640;
  const uDom=[0.86,1.06],wDom=[-0.06,0.24];
  const sOut=ih/(uDom[1]-uDom[0]);
  const uOf=t=>Math.log10(1.8*(t+273.15))/3, wOf=sg=>-Math.log10(sg);
  const yU=u=>PT+(u-uDom[0])*sOut, yW=w=>PT+(w-wDom[0])*sOut;
  const kLo=uDom[0]+wDom[0], yK=lg=>PT+(sOut/2)*(lg-kLo);
  const u=uOf(V.tb),w=wOf(SG),lg=Math.log10(K);
  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'">';
  const scale=(x,yf,dom,label,ticks,fmtT)=>{
    let t='<line x1="'+x+'" y1="'+PT+'" x2="'+x+'" y2="'+(PT+ih)+'" stroke="'+cv("--line2")+'" stroke-width="2"/>';
    t+='<text x="'+x+'" y="'+(PT-12)+'" font-size="11.5" font-weight="700" text-anchor="middle" fill="'+cv("--dim")+'">'+label+'</text>';
    ticks.forEach(v=>{const y=yf(v);if(y<PT-1||y>PT+ih+1)return;
      t+='<line x1="'+(x-7)+'" y1="'+y+'" x2="'+(x+7)+'" y2="'+y+'" stroke="'+cv("--line2")+'" stroke-width="1.4"/>';
      t+='<text x="'+(x-12)+'" y="'+(y+3.6)+'" font-size="10" text-anchor="end" fill="'+cv("--dim")+'">'+fmtT(v)+'</text>';});
    return t;};
  const tbTicks=[];for(let t=40;t<=520;t+=40)tbTicks.push(uOf(t));
  const sgTicks=[];for(let g=.60;g<=1.101;g+=.05)sgTicks.push(wOf(g));
  const kTicks=[];for(let k=8;k<=16;k+=.5)kTicks.push(Math.log10(k));
  s+=scale(xL,yU,uDom,"Tb, °C",tbTicks,v=>fmt((Math.pow(10,3*v)/1.8)-273.15,0));
  s+=scale(xR,yW,wDom,"SG 60/60",sgTicks,v=>fmt(Math.pow(10,-v),3));
  s+='<line x1="'+xM+'" y1="'+PT+'" x2="'+xM+'" y2="'+(PT+ih)+'" stroke="'+cv("--amber")+'" stroke-width="2.6"/>';
  s+='<text x="'+xM+'" y="'+(PT-12)+'" font-size="11.5" font-weight="700" text-anchor="middle" fill="'+cv("--amber")+'">UOP K</text>';
  kTicks.forEach(v=>{const y=yK(v);if(y<PT-1||y>PT+ih+1)return;
    s+='<line x1="'+(xM-8)+'" y1="'+y+'" x2="'+(xM+8)+'" y2="'+y+'" stroke="'+cv("--amber")+'" stroke-width="1.4"/>';
    s+='<text x="'+(xM+13)+'" y="'+(y+3.6)+'" font-size="10.5" fill="'+cv("--amber")+'">'+fmt(Math.pow(10,v),1)+'</text>';});
  const y1=yU(u),y2=yW(w),yk=yK(lg);
  s+='<line x1="'+xL+'" y1="'+y1+'" x2="'+xR+'" y2="'+y2+'" stroke="'+cv("--cyan")+'" stroke-width="2.4" filter="url(#ng)"/>';
  s+='<defs><filter id="ng" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="'+(2*S.chart.glow)+'" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  s+='<circle cx="'+xL+'" cy="'+y1+'" r="9" fill="'+cv("--cyan")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
  s+='<circle cx="'+xR+'" cy="'+y2+'" r="9" fill="'+cv("--acid")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
  s+='<circle cx="'+xM+'" cy="'+yk+'" r="7" fill="'+cv("--amber")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
  s+='<text x="'+(xM+16)+'" y="'+(yk-11)+'" font-size="14" font-weight="800" fill="'+cv("--amber")+'">K = '+fmt(K,2)+'</text>';
  s+='<text x="'+xL+'" y="'+(H-10)+'" font-size="10" text-anchor="middle" fill="'+cv("--dim2")+'">тяните голубую ручку</text>';
  s+='<text x="'+xR+'" y="'+(H-10)+'" font-size="10" text-anchor="middle" fill="'+cv("--dim2")+'">тяните зелёную ручку</text>';
  s+="</svg>";
  const lim=[];
  if(V.tb<30||V.tb>500)lim.push("Tb вне 30…500 °C — номограмма экстраполируется.");
  if(SG<.6||SG>1.1)lim.push("SG вне 0.60…1.10 — вне шкалы номограммы.");
  return {cards:[
   {l:"UOP K",v:fmt(K,2),u:"—",st:K>12.5?"ok":K>=11.5?"warn":"bad",big:true,note:type},
   {l:"SG 60/60",v:fmt(SG,4),u:"—",st:"info"},
   {l:"Tb в °R",v:fmt((V.tb+273.15)*1.8,1),u:"°R",st:"info"},
   {l:"База Tср",v:({mol:"мольная",mass:"массовая",vol:"объёмная",cab:"кубическая"})[R.basis],u:"",st:"info",note:"разные базы дают ΔK ≈ 0.1…0.3"}
  ],limits:lim,
  chart:{title:"Номограмма UOP K · подвижная линейка",inner:s,
    legend:'<span><i style="background:'+cv("--cyan")+'"></i>Tb</span><span><i style="background:'+cv("--amber")+'"></i>K</span><span><i style="background:'+cv("--acid")+'"></i>SG</span>',
    hint:"Возьмите ручку на шкале Tb или SG и ведите — линейка и K пересчитываются в реальном времени.",
    meta:{kind:"uop",geom:{xL:xL,xR:xR,xM:xM,PT:PT,ih:ih,yU:yU,yW:yW,uOf:uOf,wOf:wOf,uDom:uDom,wDom:wDom,W:W,H:H}}},
  tables:[{title:"Шкала классификации",head:["UOP K","Основа","Типичные нефти"],
    rows:[["> 12.5","парафиновая","Западная Сибирь, Pennsylva"],['"11.5…12.5"',"промежуточная","смешанные"],["< 11.5","ароматическая","тяжёлые калифорнийские"]]}]};
 },
 checks:[{n:"K: Tb 366 K, SG 0.664",exp:12.13,tol:.05,f:()=>watsonK(366,.664)},
  {n:"K: Tb 450 K, SG 0.85",exp:11.0,tol:.12,f:()=>watsonK(450,.85)},
  {n:"Обратный ход: SG из K",exp:.85,tol:1e-6,f:()=>Math.pow(1.8*450,1/3)/watsonK(450,.85)}]
});

/* ---------- P1-9 Молекулярная масса ---------- */
def({id:"mw",group:"Фракции",p:"P1",icon:"mw",title:"Молекулярная масса фракции",
 short:"Riazi–Daubert и Kesler–Lee, таблица псевдокомпонентов",
 tags:["молекулярная масса","mw","риази","дауберт","kesler","lee","псевдокомпонент"],
 fields:[
  F("tb","Tср кипения",{val:280,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("rho","ρ15",{val:860,unit:"кг/м³",units:["кг/м³","г/см³","°API"],g:"DENS",step:1}),
  F("n","Таблица: число фракций",{kind:"range",val:8,min:3,max:20,step:1}),
  F("t0","Tср первой",{val:90,step:1}),F("t1","Tср последней",{val:430,step:1})
 ],
 doc:{in:"Средняя температура кипения и ρ15 (или SG); для таблицы — диапазон Tср и число фракций.",
  out:"M по двум корреляциям, расхождение, UOP K, таблица M(Tср) для псевдокомпонентов.",
  formula:"Riazi–Daubert: M = 4.5673·10⁻⁵ · Tb[°R]^2.1962 · SG^−1.0164\nKesler–Lee: M = −12272.6 + 9486.4·SG + (4.6523 − 3.3287·SG)·T + … (T в °R)\nSG = ρ15 / 999.016",
  assum:"Корреляции для нефтяных фракций; на чистых лёгких алканах дают заметное завышение (проверено на н-гексане).",
  limits:"Надёжно при M ≈ 100…700 г/моль, Tb = 60…500 °C. Для M < 100 используйте справочные значения чистых компонентов.",
  src:"Riazi & Daubert, Hydrocarbon Processing (1980); Kesler & Lee (1976); API TDB 2B2.1."},
 compute(V,R){
  const SG=sgOf(V.rho),TbK=V.tb+273.15;
  const m1=mwRD(TbK,SG),m2=mwKL(TbK,SG),dev=(m1-m2)/((m1+m2)/2)*100;
  const N=clamp(S.chart.quality,40,400),a=Math.max(40,V.t0-40),b=V.t1+40,p1=[],p2=[];
  for(let i=0;i<=N;i++){const t=lerp(a,b,i/N);p1.push([t,mwRD(t+273.15,SG)]);p2.push([t,mwKL(t+273.15,SG)]);}
  const hi=Math.max(...p1.map(p=>p[1]),...p2.map(p=>p[1]))*1.05/S.chart.zoom;
  const p=plot({x:[a,b],y:[0,Math.max(60,hi)],series:[{pts:p1,color:col(0),name:"RD"},{pts:p2,color:col(1),dash:"6 4",name:"KL"}],xl:"Tср, °C",yl:"M, г/моль"});
  p.svg=p.svg.replace("</svg>",'<circle cx="'+p.X(V.tb)+'" cy="'+p.Y(clamp(m1,0,hi))+'" r="6" fill="'+cv("--amber")+'"/></svg>');
  const n=clamp(Math.round(V.n),3,20),rows=[];
  for(let i=0;i<n;i++){const t=lerp(V.t0,V.t1,i/(n-1||1)),sg=sgOf(lerp(700,945,i/(n-1||1)));

  F("s5","Поток 5: доля %",{val:0,step:1}),F("r5","ρ15, кг/м³",{val:820,step:1}),F("su5","сера, % масс.",{val:.8,step:.01}),F("pa5","парафины, %",{val:25,step:1}),
  F("total","Расход смеси",{val:120,unit:"т/ч",units:["т/ч","кг/ч","м³/ч"],g:"MASS",step:1})
 ],
 doc:{in:"До 5 потоков: доля, ρ15, сера, парафины; база долей (масса/объём) и расход смеси.",
  out:"Свойства смеси, нормированные доли, расход каждого потока, донат структуры смеси.",
  formula:"По массе: X = Σ wi·Xi,  wi = mi/Σm\nПо объёму: ρ = Σ vi·ρi;  сера по массе = Σ(vi·ρi·Si)/Σ(vi·ρi)\nДоли нормируются к 100 % автоматически (показывается и исходная сумма).",
  assum:"Линейно смешиваются плотность (объёмная аддитивность), сера и парафины по массе. Октан и ДНП линейно НЕ смешиваются — для них отдельные калькуляторы.",
  limits:"Объёмная аддитивность даёт погрешность до 0.5 % на смесях лёгких и тяжёлых потоков (усадка). Сера > 3 % — вне типичного товарного диапазона.",
  src:"Справочник технолога-нефтепереработчика, правила компаундирования; ГОСТ 31378 (сера)."},
 compute(V,R){
  const n=clamp(Math.round(V.n),2,5),arr=[];
  for(let i=1;i<=n;i++)arr.push({i:i,s:Math.max(0,V["s"+i]),r:V["r"+i],su:V["su"+i],pa:V["pa"+i]});
  const raw=arr.reduce((a,b)=>a+b.s,0)||1;

  const mass=arr.map(a=>R.basis==="vol"?a.f*a.r:a.f);
  const mt=mass.reduce((x,y)=>x+y,0)||1;
  const wm=mass.map(m=>m/mt);
  const rho=R.basis==="vol"?arr.reduce((s,a)=>s+a.f*a.r,0):1/arr.reduce((s,a,i)=>s+wm[i]/a.r,0);
  const su=arr.reduce((s,a,i)=>s+wm[i]*a.su,0);
  const pa=arr.reduce((s,a,i)=>s+wm[i]*a.pa,0);

  const parts=arr.map((a,i)=>({v:wm[i]*100,n:"Поток "+a.i,c:col(i)}));

   {l:"Парафины",v:fmt(pa,1),u:"%",st:"info"},
   {l:"Нормировка",v:fmt(raw,1)+" → 100",u:"%",st:Math.abs(raw-100)>.5?"warn":"ok"}
  ],limits:lim,
  chart:{title:"Структура смеси (по массе)",inner:'<div style="display:grid;place-items:center;padding:12px">'+donut(parts,190)+'</div>',
    legend:parts.map((p,i)=>'<span><i style="background:'+p.c+'"></i>Поток '+(i+1)+' · '+fmt(p.v,1)+' %</span>').join(""),meta:{kind:"none"}},
  tables:[{title:"Потоки",head:["Поток","Доля введ., %","Доля норм., %","Расход, т/ч","ρ15","S, %","Парафины, %"],
    rows:arr.map((a,i)=>["№"+a.i,fmt(a.s,1),fmt(wm[i]*100,2),fmt(flows[i],2),fmt(a.r,0),fmt(a.su,3),fmt(a.pa,1)]),num:[1,2,3,4,5,6]}]};
 },
 checks:[{n:"ρ по массе 50/50: 735 и 800",exp:766.1,tol:.6,f:()=>1/(0.5/735+0.5/800)},
  {n:"Сера 50/50: 0.15 и 0.45",exp:.30,tol:1e-9,f:()=>0.5*.15+0.5*.45},
  {n:"ρ по объёму 50/50",exp:767.5,tol:1e-9,f:()=>0.5*735+0.5*800}]
});

def({id:"octane",group:"Смешение",p:"P1",icon:"octane",title:"Октановое число смеси",

 fields:[

  F("c1","Компонент 1",{kind:"sel",val:"reform",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v1","доля, % об.",{val:45,step:1}),
  F("c2","Компонент 2",{kind:"sel",val:"2",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v2","доля, % об.",{val:40,step:1}),
  F("c3","Компонент 3",{kind:"sel",val:"5",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v3","доля, % об.",{val:15,step:1}),
  F("c4","Компонент 4",{kind:"sel",val:"4",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v4","доля, % об.",{val:0,step:1}),
  F("c5","Компонент 5",{kind:"sel",val:"8",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v5","доля, % об.",{val:0,step:1}),
  F("model","Модель",{kind:"sel",val:"inter",opts:[{v:"lin",t:"линейная (оценка)"},{v:"inter",t:"парные взаимодействия"}]}),
  F("k","Коэф. взаимодействия k",{val:-8,step:.5}),
  F("labON","Лаб. ОЧИ смеси (калибровка)",{val:0,step:.1}),
  F("target","Целевой ОЧИ",{val:95,step:.1})
 ],
 doc:{in:"До 5 компонентов из библиотеки (или свои ОЧИ/ОЧМ), объёмные доли, модель и коэффициент взаимодействия.",
  out:"ОЧИ и ОЧМ смеси, индекс смешения, требуемая доля высокооктанового компонента для цели, калибровка k по лабораторной точке.",
  formula:"Линейная: ON = Σ vi·ONi\nВзаимодействия: ON = Σ vi·ONi + k·Σ_{i<j} vi·vj\nКалибровка: k = (ONлаб − Σ vi·ONi) / Σ_{i<j} vi·vj\nBI (индекс) = ON + k·(1 − vi) для компонента i",
  assum:"Октановое число НЕ аддитивно: парафин-олефин-ароматические взаимодействия дают отклонения до ±3 единиц. Модель парных взаимодействий с одним k — рабочая инженерная аппроксимация, калибруется по одной лабораторной точке.",
  limits:"Библиотечные ОЧИ/ОЧМ — типовые значения, не паспорт партии. Для товарного бензина арбитраж — лаборатория (ГОСТ 8226 / ASTM D2699).",
  src:"Справочник технолога: blending values; ASTM D2699 (RON) / D2700 (MON); практика компаундирования."},
 compute(V,R){
  const n=clamp(Math.round(V.n),2,5),arr=[];
  for(let i=1;i<=n;i++){const c=BLEND_LIB[clamp(parseInt(R["c"+i],10)||0,0,BLEND_LIB.length-1)];
    arr.push({i:i,c:c,v:Math.max(0,V["v"+i])});}
  const tot=arr.reduce((s,a)=>s+a.v,0)||1;arr.forEach(a=>{a.f=a.v/tot;});
  const lin=arr.reduce((s,a)=>s+a.f*a.c.ron,0),linM=arr.reduce((s,a)=>s+a.f*a.c.mon,0);
  let pair=0;for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)pair+=arr[i].f*arr[j].f;
  const useK=R.model==="inter"?V.k:0;
  const ron=lin+useK*pair,mon=linM+useK*pair*0.85;
  const kCal=V.labON>0&&pair>1e-9?(V.labON-lin)/pair:NaN;
  /* обратная задача: доля риформата (компонент с максимальным ОЧИ) для цели */
  const hiIdx=arr.reduce((b,a,i)=>a.c.ron>arr[b].c.ron?i:b,0);
  const others=arr.filter((_,i)=>i!==hiIdx),os=others.reduce((s,a)=>s+a.f,0)||1;
  const fOf=x=>{const fs=arr.map((a,i)=>i===hiIdx?x:a.f/os*(1-x));
    let pr=0;for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++)pr+=fs[i]*fs[j];
    return fs.reduce((s,f,i)=>s+f*arr[i].c.ron,0)+useK*pr-V.target;};
  const xNeed=bisect(fOf,0,1,1e-7);
  const parts=arr.map((a,i)=>({v:a.f*100,n:a.c.n,c:col(i)}));
  const N=clamp(S.chart.quality,40,400),pts=[];
  for(let i=0;i<=N;i++){const x=i/N;pts.push([x*100,lin*0+ (arr.map((a,j)=>j===hiIdx?x:a.f/os*(1-x)).reduce((s,f,j)=>s+f*arr[j].c.ron,0)) + useK*(()=>{const fs=arr.map((a,j)=>j===hiIdx?x:a.f/os*(1-x));let pr=0;for(let p=0;p<fs.length;p++)for(let q=p+1;q<fs.length;q++)pr+=fs[p]*fs[q];return pr;})()]);}
  const ys=pts.map(p=>p[1]),lo=Math.min(...ys,V.target)-3,hi=Math.max(...ys,V.target)+3,span=(hi-lo)/S.chart.zoom,mid=(hi+lo)/2;
  const p=plot({x:[0,100],y:[mid-span/2,mid+span/2],series:[{pts:pts,color:col(0),name:"ОЧИ смеси"}],xl:"доля «"+arr[hiIdx].c.n+"», % об.",yl:"ОЧИ"});
  let ex='<line x1="'+p.PL+'" y1="'+p.Y(V.target)+'" x2="'+(p.PL+p.iw)+'" y2="'+p.Y(V.target)+'" stroke="'+cv("--acid")+'" stroke-width="1.8" stroke-dasharray="6 4"/>'
    +'<text x="'+(p.PL+6)+'" y="'+(p.Y(V.target)-6)+'" font-size="10.5" fill="'+cv("--acid")+'">цель '+fmt(V.target,1)+'</text>';
  if(isN(xNeed))ex+='<circle cx="'+p.X(xNeed*100)+'" cy="'+p.Y(V.target)+'" r="7" fill="'+cv("--acid")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
  p.svg=p.svg.replace("</svg>",ex+"</svg>");
  const lim=["Октан не аддитивен: без калибровки по лабораторной точке погрешность ±1…3 единицы."];
  if(V.labON<=0)lim.push("Введите лабораторный ОЧИ смеси — тогда k откалибруется и расчёт станет достоверным для этой рецептуры.");
  if(Math.abs(ron-lin)>4)lim.push("Поправка взаимодействий > 4 единиц — проверьте k.");
  return {cards:[
   {l:"ОЧИ смеси (RON)",v:fmt(ron,2),u:"—",st:ron>=V.target?"ok":"warn",big:true,note:"линейная оценка "+fmt(lin,2)+" · поправка "+fmt(ron-lin,2)},
   {l:"ОЧМ смеси (MON)",v:fmt(mon,2),u:"—",st:"info"},
   {l:"Аки (RON+MON)/2",v:fmt((ron+mon)/2,2),u:"—",st:"info"},
   {l:"k по лаборатории",v:isN(kCal)?fmt(kCal,2):"—",u:"—",st:isN(kCal)?"ok":"info",note:isN(kCal)?"примените это значение в поле k":"введите лаб. ОЧИ"},
   {l:"Доля «"+arr[hiIdx].c.n+"» для цели",v:isN(xNeed)?fmt(xNeed*100,1):"недостижимо",u:isN(xNeed)?"% об.":"",st:isN(xNeed)?"ok":"bad"}
  ],limits:lim,
  chart:{title:"ОЧИ от доли высокооктанового компонента",inner:p.svg,
    legend:'<span><i style="background:'+col(0)+'"></i>ОЧИ смеси</span><span><i style="background:'+cv("--acid")+'"></i>целевой уровень</span>',
    hint:"Зелёная линия — цель; точка пересечения даёт требуемую долю.",meta:{kind:"none"}},
  tables:[{title:"Компоненты",head:["Компонент","ОЧИ","ОЧМ","ДНП, кПа","ρ15","Доля, % об.","BI (индекс)"],
    rows:arr.map(a=>[a.c.n,fmt(a.c.ron,0),fmt(a.c.mon,0),fmt(a.c.rvp,0),fmt(a.c.rho,0),fmt(a.f*100,2),fmt(a.c.ron+useK*(1-a.f),2)]),num:[1,2,3,4,5,6]}]};
 },
 checks:[{n:"Чистый риформат → ОЧИ 100",exp:100,tol:1e-9,f:()=>1*100+(-8)*0},
  {n:"Линейная 50/50: 92 и 98",exp:95,tol:1e-9,f:()=>.5*92+.5*98},
  {n:"Поправка k при 50/50, k=−8",exp:-2,tol:1e-9,f:()=>-8*(.5*.5)}]

  F("req","Требование по ПТФ (класс)",{val:-20,step:1})
 ],
 doc:{in:"ρ15 и точки Д86 (10/50/90 %); до 5 компонентов с T помутнения и ПТФ; эффект депрессорной добавки.",
  out:"Цетановый индекс по ASTM D976 и D4737, оценка T помутнения и ПТФ смеси, соответствие требованию.",
  formula:"D976: CI = 454.74 − 1641.416·D + 774.74·D² − 0.554·B + 97.803·(lg B)²,  D = ρ15[г/мл], B = T50[°C]\nD4737 (CCI): 45.2 + 0.0892·T10N + (0.131 + 0.901·B')·T50N + (0.0523 − 0.420·B')·T90N + 0.00049·(T10N² − T90N²) + 107·B' + 60·B'²\nгде T10N = T10 − 215, T50N = T50 − 260, T90N = T90 − 310, B' = ρ15[г/мл] − 0.85\nПТФ смеси ≈ Σ vi·ПТФi + Δдепрессор",
  assum:"Цетановый индекс — расчётная оценка цетанового числа по плотности и фракционному составу, не заменяет моторный метод. Холодные свойства смешиваются нелинейно; линейная оценка даёт запас только как первый ориентир.",
  limits:"D976: ρ15 = 0.80…0.90 г/мл, T50 = 200…340 °C. ПТФ смеси: линейное смешение систематически оптимистично на 2…6 °C — арбитраж по ГОСТ 22254 / EN 116.",
  src:"ASTM D976, ASTM D4737; ГОСТ 32508 (ПТФ), ГОСТ 5542; практика применения депрессорных присадок."},
 compute(V,R){
