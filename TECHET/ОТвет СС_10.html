  for(let i=1;i<=n;i++)arr.push({i:i,f:Math.max(0,V["f"+i]),cp:V["cp"+i],cf:V["cf"+i]});
  const tot=arr.reduce((s,a)=>s+a.f,0)||1;arr.forEach(a=>{a.f/=tot;});
  const cp=arr.reduce((s,a)=>s+a.f*a.cp,0),cf=arr.reduce((s,a)=>s+a.f*a.cf,0)+V.dep;
  const pass=cf<=V.req;
  const lim=["Линейное смешение ПТФ оптимистично: реальный ПТФ может быть на 2…6 °C выше."];
  if(V.rho/1000<.8||V.rho/1000>.9)lim.push("ρ15 вне 0.80…0.90 г/мл — D976 вне области.");
  if(V.t50<200||V.t50>340)lim.push("T50 вне 200…340 °C — D976 экстраполируется.");
  if(V.dep<-15)lim.push("ΔПТФ от присадки > 15 °C — типичный предел депрессоров, проверьте по паспорту присадки.");
  const items=[{n:"Цетановый индекс D976",v:ci,t:fmt(ci,1),c:col(0)},
    {n:"CCI D4737",v:cci,t:fmt(cci,1),c:col(1)},
    {n:"T помутнения",v:Math.abs(cp),t:fmt(cp,1)+" °C",c:col(2)},
    {n:"ПТФ смеси",v:Math.abs(cf),t:fmt(cf,1)+" °C",c:pass?cv("--ok"):cv("--bad")}];
  return {cards:[
   {l:"Цетановый индекс (D976)",v:fmt(ci,1),u:"—",st:ci>=51?"ok":ci>=46?"warn":"bad",big:true,note:"требование Евро-5: ЦЧ ≥ 51"},
   {l:"CCI (D4737)",v:fmt(cci,1),u:"—",st:"info",note:"расхождение с D976: "+fmt(ci-cci,1)},
   {l:"T помутнения смеси",v:fmt(cp,1),u:"°C",st:"info"},
   {l:"ПТФ смеси",v:fmt(cf,1),u:"°C",st:pass?"ok":"bad",note:pass?"требование "+fmt(V.req,0)+" °C выполнено (с оговоркой)":"не дотягивает до "+fmt(V.req,0)+" °C"},
   {l:"Запас по ПТФ",v:fmt(V.req-cf,1),u:"°C",st:(V.req-cf)>=3?"ok":(V.req-cf)>=0?"warn":"bad"}
  ],limits:lim,
  chart:{title:"Показатели смеси",inner:'<div style="padding:12px">'+barsH(items)+'</div>',meta:{kind:"none"}},
  tables:[{title:"Компоненты по холодным свойствам",head:["№","Доля, %","T помутн., °C","ПТФ, °C"],
    rows:arr.map(a=>["№"+a.i,fmt(a.f*100,2),fmt(a.cp,1),fmt(a.cf,1)]),num:[1,2,3]}]};
 },
 checks:[{n:"D976: ρ 840, T50 260 ≈ 49.1",exp:49.06,tol:.25,f:()=>cetaneD976(840,260)},
  {n:"ПТФ 50/50: −18 и −32 → −25",exp:-25,tol:1e-9,f:()=>.5*-18+.5*-32},
  {n:"Депрессор −6 applied",exp:-31,tol:1e-9,f:()=>(.5*-18+.5*-32)-6}]
});

/* ---------- P1-13 RVP ---------- */
def({id:"rvp",group:"Смешение",p:"P1",icon:"rvp",title:"ДНП смеси (RVP)",
 short:"Индексное смешение RVP^1.25, лето/зима",
 tags:["rvp","днп","давление насыщенных паров","рейд","бутан","летний","зимний","летучесть","индекс"],
 fields:[
  F("n","Компонентов",{kind:"range",val:3,min:2,max:5,step:1}),
  F("c1","Компонент 1",{kind:"sel",val:"1",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v1","доля, % об.",{val:45,step:1}),
  F("c2","Компонент 2",{kind:"sel",val:"2",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v2","доля, % об.",{val:45,step:1}),
  F("c3","Компонент 3",{kind:"sel",val:"5",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v3","доля, % об.",{val:10,step:1}),
  F("c4","Компонент 4",{kind:"sel",val:"4",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v4","доля, % об.",{val:0,step:1}),
  F("c5","Компонент 5",{kind:"sel",val:"8",opts:()=>BLEND_LIB.map((c,i)=>({v:String(i),t:c.n}))}),F("v5","доля, % об.",{val:0,step:1}),
  F("lim","Норматив ДНП",{val:90,unit:"кПа",units:["кПа","мм рт.ст.","psi","бар"],g:"P",step:1}),
  F("season","Сезон",{kind:"sel",val:"summer",opts:[{v:"summer",t:"Летний"},{v:"winter",t:"Зимний"}]})
 ],
 doc:{in:"Компоненты с известным ДНП и объёмные доли; норматив и сезон.",
  out:"ДНП смеси в кПа / мм рт.ст. / psi, индекс смешения, запас до норматива, максимальная доля бутана.",
  formula:"BI = RVP^1.25;  BI_смеси = Σ vi·BIi;  RVP_смеси = BI_смеси^(1/1.25)\nМаксимальная доля бутана: решить Σ vi(f)·BIi = BI_норматив по f",
  assum:"Индексный метод (степень 1.25) — промышленный стандарт для бензинов; объёмная аддитивность индексов.",
  limits:"Работает для углеводородных бензиновых потоков. Спирты и эфиры дают аномалии (azeotrope) — нужен лабораторный ДНП. Норматив: лето ≤ 90 кПа, зима ≤ 100 кПа (ориентир, уточняйте ТР ТС 013/2011).",
  src:"Chevron / API blending index для RVP; ASTM D5191 / ГОСТ 31873; ТР ТС 013/2011."},
 compute(V,R){
  const n=clamp(Math.round(V.n),2,5),arr=[];
  for(let i=1;i<=n;i++){const c=BLEND_LIB[clamp(parseInt(R["c"+i],10)||0,0,BLEND_LIB.length-1)];arr.push({c:c,v:Math.max(0,V["v"+i])});}
  const tot=arr.reduce((s,a)=>s+a.v,0)||1;arr.forEach(a=>{a.f=a.v/tot;});
  const bi=arr.reduce((s,a)=>s+a.f*rvpBI(a.c.rvp),0),rvp=rvpFromBI(bi);
  const lin=arr.reduce((s,a)=>s+a.f*a.c.rvp,0);
  const biIdx=arr.reduce((b,a,i)=>a.c.rvp>arr[b].c.rvp?i:b,0);
  const os=arr.filter((_,i)=>i!==biIdx).reduce((s,a)=>s+a.f,0)||1;
  const fMax=bisect(f=>{const fs=arr.map((a,i)=>i===biIdx?f:a.f/os*(1-f));
    return rvpFromBI(fs.reduce((s,x,i)=>s+x*rvpBI(arr[i].c.rvp),0))-V.lim;},0,1,1e-7);
  const N=clamp(S.chart.quality,40,400),pts=[];
  for(let i=0;i<=N;i++){const f=i/N,fs=arr.map((a,j)=>j===biIdx?f:a.f/os*(1-f));
    pts.push([f*100,rvpFromBI(fs.reduce((s,x,j)=>s+x*rvpBI(arr[j].c.rvp),0))]);}
  const hi=Math.max(...pts.map(p=>p[1]),V.lim)*1.12/S.chart.zoom;
  const p=plot({x:[0,100],y:[0,hi],series:[{pts:pts,color:col(0),area:true,name:"ДНП смеси"}],xl:"доля «"+arr[biIdx].c.n+"», % об.",yl:"ДНП, кПа"});
  let ex='<line x1="'+p.PL+'" y1="'+p.Y(V.lim)+'" x2="'+(p.PL+p.iw)+'" y2="'+p.Y(V.lim)+'" stroke="'+cv("--bad")+'" stroke-width="1.8" stroke-dasharray="6 4"/>'
   +'<text x="'+(p.PL+6)+'" y="'+(p.Y(V.lim)-6)+'" font-size="10.5" fill="'+cv("--bad")+'">норматив '+fmt(V.lim,0)+' кПа</text>'
   +'<circle cx="'+p.X(arr[biIdx].f*100)+'" cy="'+p.Y(rvp)+'" r="6.5" fill="'+cv("--amber")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
  if(isN(fMax))ex+='<circle cx="'+p.X(fMax*100)+'" cy="'+p.Y(V.lim)+'" r="6.5" fill="'+cv("--acid")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
  p.svg=p.svg.replace("</svg>",ex+"</svg>");
  const lim=[];
  if(rvp>V.lim)lim.push("ДНП выше норматива на "+fmt(rvp-V.lim,1)+" кПа — снизьте долю лёгких компонентов.");
  if(arr.some(a=>a.c.n==="МТБЭ"))lim.push("Эфиры/спирты: индексный метод может занижать ДНП — нужен лабораторный замер.");
  return {cards:[
   {l:"ДНП смеси",v:fmt(rvp,1),u:"кПа",st:rvp<=V.lim?"ok":"bad",big:true,note:fmt(rvp/0.1333224,0)+" мм рт.ст. · "+fmt(rvp/6.894757,2)+" psi"},
   {l:"Норматив / запас",v:fmt(V.lim-rvp,1),u:"кПа",st:(V.lim-rvp)>=5?"ok":(V.lim-rvp)>=0?"warn":"bad",note:R.season==="summer"?"летний":"зимний"},
   {l:"Линейная оценка",v:fmt(lin,1),u:"кПа",st:"info",note:"индексный метод даёт "+fmt(rvp-lin,1)+" кПа"},
   {l:"Макс. доля «"+arr[biIdx].c.n+"»",v:isN(fMax)?fmt(fMax*100,1):"—",u:"% об.",st:isN(fMax)?"ok":"bad"}
  ],limits:lim,chart:{title:"ДНП от доли лёгкого компонента",inner:p.svg,
    legend:'<span><i style="background:'+col(0)+'"></i>ДНП смеси</span><span><i style="background:'+cv("--bad")+'"></i>норматив</span><span><i style="background:'+cv("--amber")+'"></i>текущий рецепт</span>',
    hint:"Тяните по графику — доля лёгкого компонента меняется, ДНП пересчитывается.",meta:{kind:"lin",p:p,share:biIdx}},
  tables:[{title:"Компоненты",head:["Компонент","ДНП, кПа","BI = RVP^1.25","Доля, % об.","Вклад в BI"],
    rows:arr.map(a=>[a.c.n,fmt(a.c.rvp,0),fmt(rvpBI(a.c.rvp),1),fmt(a.f*100,2),fmt(a.f*rvpBI(a.c.rvp),1)]),num:[1,2,3,4]}]};
 },
 checks:[{n:"Чистый н-бутан → 355 кПа",exp:355,tol:1e-6,f:()=>rvpFromBI(rvpBI(355))},
  {n:"Индекс 50/50: 25 и 355",exp:154.1,tol:2.5,f:()=>rvpFromBI(.5*rvpBI(25)+.5*rvpBI(355))},
  {n:"Round-trip индекса",exp:90,tol:1e-9,f:()=>rvpFromBI(rvpBI(90))}]
});

/* ---------- P1-14 Обратная задача ---------- */
def({id:"inverse",group:"Смешение",p:"P1",icon:"inverse",title:"Обратная задача смешения",
 short:"«Сколько добавить бутана, чтобы ДНП стало 500 мм рт.ст.»",
 tags:["обратная задача","сколько добавить","бутан","целевое свойство","днп","сера","октан","подбор рецепта"],
 fields:[
  F("prop","Свойство",{kind:"sel",val:"rvp",opts:[{v:"rvp",t:"ДНП (индекс 1.25)"},{v:"sulfur",t:"сера, % масс."},{v:"rho",t:"плотность, кг/м³"},{v:"ron",t:"ОЧИ (линейно)"}]}),
  F("target","Целевое значение",{val:500,step:1}),
  F("tu","Единица цели (для ДНП)",{kind:"sel",val:"мм рт.ст.",opts:["кПа","мм рт.ст.","psi","бар"]}),
  F("baseP","Базовый поток: свойство",{val:55,step:.1}),
  F("baseQ","Базовый поток: количество",{val:100,unit:"т/ч",units:["т/ч","кг/ч","м³/ч"],g:"MASS",step:1}),
  F("addP","Добавка: свойство",{val:355,step:.1}),
  F("rhoB","ρ15 базы",{val:750,step:1}),F("rhoA","ρ15 добавки",{val:580,step:1}),
  F("cap","Предел добавки",{val:12,step:.5})
 ],
 doc:{in:"Свойство и целевое значение, свойства и количество базового потока, свойство добавки, предел добавки.",
  out:"Требуемое количество и доля добавки, итоговое свойство, проверка достижимости и предела.",
  formula:"ДНП: цель^1.25 = (1−f)·Pб^1.25 + f·Pд^1.25  →  f = (BIц − BIб)/(BIд − BIб)\nЛинейные свойства: f = (Xц − Xб)/(Xд − Xб)\nКоличество добавки: mд = mб·f/(1−f) (по массе) либо через ρ при объёмной базе",
  assum:"Для ДНП используется индекс 1.25 и объёмные доли; для серы — массовые; для плотности — объёмная аддитивность; для ОЧИ — линейная оценка (уточните в калькуляторе октана).",
  limits:"Если цель вне интервала между свойствами базы и добавки — решения нет. Для ОЧИ линейная модель даёт ошибку ±1…3 единицы.",
  src:"Правила компаундирования; Chevron RVP blending index; материальный баланс смешения."},
 compute(V,R){
  const isRvp=R.prop==="rvp";
  const tgt=isRvp?toBase("P",V.target,R.tu):V.target;
  const bp=isRvp?V.baseP:V.baseP, ap=isRvp?V.addP:V.addP;
  const tb=isRvp?rvpBI(bp):bp, ta=isRvp?rvpBI(ap):ap, tt=isRvp?rvpBI(tgt):tgt;
  const f=(ta!==tb)?(tt-tb)/(ta-tb):NaN;
  const ok=isN(f)&&f>=0&&f<=1;
  const volB=V.baseQ*1000/Math.max(V.rhoB,1);
  const volA=ok?volB*f/(1-f):NaN;
  const massA=ok?volA*V.rhoA/1000:NaN;
  const shareMass=ok?massA/(massA+V.baseQ)*100:NaN;
  const N=clamp(S.chart.quality,40,400),pts=[];
  for(let i=0;i<=N;i++){const x=i/N*0.35;const mix=isRvp?rvpFromBI((1-x)*tb+x*ta):(1-x)*tb+x*ta;pts.push([x*100,mix]);}
  const ys=pts.map(p=>p[1]).concat([tgt]),lo=Math.min(...ys)*.92,hi=Math.max(...ys)*1.08,span=(hi-lo)/S.chart.zoom,mid=(hi+lo)/2;
  const p=plot({x:[0,35],y:[mid-span/2,mid+span/2],series:[{pts:pts,color:col(0),area:true,name:"свойство смеси"}],
    xl:"доля добавки, % "+(isRvp?"об.":"масс."),yl:isRvp?"ДНП, кПа":"значение свойства"});
  let ex='<line x1="'+p.PL+'" y1="'+p.Y(tgt)+'" x2="'+(p.PL+p.iw)+'" y2="'+p.Y(tgt)+'" stroke="'+cv("--acid")+'" stroke-width="1.8" stroke-dasharray="6 4"/>'
   +'<text x="'+(p.PL+6)+'" y="'+(p.Y(tgt)-6)+'" font-size="10.5" fill="'+cv("--acid")+'">цель '+fmt(tgt,1)+(isRvp?" кПа":"")+'</text>';
  if(ok)ex+='<circle cx="'+p.X(f*100)+'" cy="'+p.Y(tgt)+'" r="7" fill="'+cv("--acid")+'" stroke="'+cv("--surface")+'" stroke-width="2"/>';
  p.svg=p.svg.replace("</svg>",ex+"</svg>");
  const lim=[];
  if(!ok)lim.push("Цель недостижима этой парой потоков: она вне интервала между свойством базы и добавки.");
  if(ok&&shareMass>V.cap)lim.push("Требуемая доля "+fmt(shareMass,1)+" % превышает предел "+fmt(V.cap,1)+" % — нужен другой компонент или второй поток.");
  if(R.prop==="ron")lim.push("ОЧИ смешивается нелинейно: линейная обратная задача — только первый ориентир.");
  return {cards:[
   {l:"Требуемая доля добавки",v:ok?fmt(f*100,2):"нет решения",u:ok?(isRvp?"% об.":"% масс."):"",st:ok?(shareMass<=V.cap?"ok":"warn"):"bad",big:true,
     note:ok?("по массе "+fmt(shareMass,2)+" %"):"измените компонент или цель"},
   {l:"Количество добавки",v:ok?fmt(massA,2):"—",u:"т/ч",st:"info",note:ok?fmt(volA,2)+" м³/ч":""},
   {l:"Итоговый поток",v:ok?fmt(V.baseQ+massA,2):"—",u:"т/ч",st:"info"},
   {l:"Цель в базовых единицах",v:fmt(tgt,2),u:isRvp?"кПа":"—",st:"info",note:isRvp?fmt(V.target,1)+" "+R.tu:""},
   {l:"Предел добавки",v:fmt(V.cap,1),u:"%",st:ok&&shareMass<=V.cap?"ok":"warn"}
  ],limits:lim,chart:{title:"Свойство смеси от доли добавки",inner:p.svg,
    legend:'<span><i style="background:'+col(0)+'"></i>свойство</span><span><i style="background:'+cv("--acid")+'"></i>цель и решение</span>',
    hint:"Тяните по графику — целевое значение меняется, решение пересчитывается.",meta:{kind:"lin",p:p,inverse:true}}};
 },
 checks:[{n:"ДНП: 55 → 355, цель 66.66 кПа (500 мм)",exp:12.0,tol:1.5,f:()=>{
   const tt=rvpBI(500*0.1333224),tb=rvpBI(55),ta=rvpBI(355);return (tt-tb)/(ta-tb)*100;}},
  {n:"Сера: 0.5 → 0.01, цель 0.2",exp:61.22,tol:.05,f:()=>(0.2-0.5)/(0.01-0.5)*100},
  {n:"Линейная обратная: 100 → 200, цель 150",exp:50,tol:1e-9,f:()=>(150-100)/(200-100)*100}]
});

/* ---------- P2-15 NPSH ---------- */
def({id:"npsh",group:"Поле",p:"P2",icon:"npsh",title:"NPSH и кавитация",
 short:"Вход в единицах прибора, вердикт по запасу",
 tags:["npsh","нпш","кавитация","насос","всас","подпор","манометр","запас"],
 fields:[
  F("pg","Манометр на всасе",{val:.35,unit:"кгс/см²",units:["МПа","кПа","бар","кгс/см²","psi","мм рт.ст."],g:"P",step:.01}),
  F("patm","Атмосферное давление",{val:101.325,unit:"кПа",units:["кПа","мм рт.ст.","бар","кгс/см²"],g:"P",step:.1}),
  F("t","Температура жидкости",{val:80,unit:"°C",units:["°C","K","°F"],g:"T",step:1}),
  F("rho","Плотность при T",{val:740,unit:"кг/м³",units:["кг/м³","г/см³","°API"],g:"DENS",step:1}),
  F("pv","ДНП жидкости при T",{val:48,unit:"кПа",units:["кПа","мм рт.ст.","бар","кгс/см²"],g:"P",step:1}),
  F("z","Геометр. подпор (+ вверх)",{val:2.5,unit:"м",units:["м","мм","см","фут"],g:"LEN",step:.1}),
  F("hf","Потери во всасе",{val:.6,unit:"м",units:["м","мм","см","фут"],g:"LEN",step:.1}),
  F("npshr","NPSHr насоса (паспорт)",{val:3.2,unit:"м",units:["м","мм","см","фут"],g:"LEN",step:.1}),
  F("q","Расход",{val:120,unit:"м³/ч",units:["м³/ч","л/мин","л/с"],g:"VOL",step:1}),
  F("d","Диаметр всаса",{val:150,unit:"мм",units:["мм","см","м","дюйм"],g:"LEN",step:1})
 ],
 doc:{in:"Показание манометра на всасе, атмосферное давление, T, ρ, ДНП, геометрия, потери, NPSHr, расход и диаметр.",
  out:"NPSHa в метрах и кПа, запас до NPSHr, вердикт по кавитации, скорость во всасе.",
  formula:"NPSHa = (pман + pатм − pнас)/(ρ·g) + z − hпот\nv = 4·Q/(π·d²);  hскор = v²/(2g) (входит в потери, если заданы отдельно)\nЗапас = NPSHa − NPSHr",
  assum:"Манометр показывает избыточное давление. Если на всасе вакуумметр — введите отрицательное значение. z > 0 — уровень выше оси насоса.",
  limits:"Рекомендуемый запас ≥ 0.5…1.0 м (или ≥ 10 % NPSHr). Скорость во всасе > 2 м/с — риск потерь и подсоса. Формула не учитывает растворённый газ.",
  src:"ГОСТ 32576 / ISO 9906; HI Standards (NPSH margin); справочник насосчика."},
 compute(V,R){
  const g=9.80665,dp=(V.pg+V.patm-V.pv)*1000;
  const head=dp/(Math.max(V.rho,1)*g);
  const npsh=head+V.z-V.hf,margin=npsh-V.npshr;
  const area=Math.PI*Math.pow(V.d/1000,2)/4,vel=(V.q/3600)/Math.max(area,1e-9);
  const hv=vel*vel/(2*g);
  const st=margin>=Math.max(1,.1*V.npshr)?"ok":margin>=0?"warn":"bad";
  const verdict=st==="ok"?"Кавитации нет — запас достаточный":st==="warn"?"На границе: запас мал, снизьте потери или поднимите уровень":"КАВИТАЦИЯ: NPSHa < NPSHr — насос работать так не должен";
  const items=[{n:"NPSHa",v:npsh,t:fmt(npsh,2)+" м",c:st==="bad"?cv("--bad"):cv("--ok")},
    {n:"NPSHr",v:V.npshr,t:fmt(V.npshr,2)+" м",c:col(4)},
    {n:"Запас",v:Math.max(0,margin),t:fmt(margin,2)+" м",c:st==="ok"?cv("--ok"):cv("--warn")},

  ],limits:lim,chart:{title:"Баланс напоров",inner:'<div style="padding:12px">'+barsH(items)+'</div>',meta:{kind:"none"}}};
 },
 checks:[{n:"1 кгс/см² → 10 м вод. ст.",exp:10.0,tol:.02,f:()=>98066.5/(1000*9.80665)},
  {n:"NPSHa: (35+101.325−48) кПа, ρ740, z2.5, hf0.6",exp:13.84,tol:.12,f:()=>(0.35*98.0665+101.325-48)*1000/(740*9.80665)+2.5-0.6},

/* ---------- P2-16 Сепаратор ---------- */
def({id:"sep",group:"Поле",p:"P2",icon:"sep",title:"Сепаратор: займёт ли",
 short:"Саудерс–Браун, время отстоя, габарит и V/L",
 tags:["сепаратор","саудерс","браун","отстой","габарит","диаметр","vl","фазы","заполнение"],
 fields:[
  F("qg","Газ",{val:35000,unit:"м³/ч",units:["м³/ч","м³/сут","нм³/ч"],g:"VOL",step:100}),
  F("ql","Жидкость",{val:120,unit:"м³/ч",units:["м³/ч","л/мин","м³/сут"],g:"VOL",step:1}),
  F("rg","ρ газа (раб. усл.)",{val:45,step:.5}),F("rl","ρ жидкости",{val:720,step:1}),
  F("K","Коэф. Саудерса–Брауна",{val:.107,step:.001}),
  F("tres","Время отстоя жидкости",{val:3,unit:"мин",units:["с","мин","ч"],g:"TIME",step:.5}),
  F("fill","Доля заполнения жидкостью",{kind:"range",val:50,min:20,max:80,step:5}),
  F("ld","L/D (горизонтальный)",{kind:"range",val:3.5,min:2,max:6,step:.1}),
  F("Dav","Доступный диаметр",{val:2.4,unit:"м",units:["м","мм","дюйм"],g:"LEN",step:.1}),
  F("Lav","Доступная длина",{val:8,unit:"м",units:["м","мм","фут"],g:"LEN",step:.1}),
  F("beta","Доля пара на входе β (мол.)",{kind:"range",val:.35,min:0,max:1,step:.01})
 ],
 doc:{in:"Расходы газа и жидкости, плотности в рабочих условиях, K, время отстоя, заполнение, L/D и доступный габарит.",
  out:"Требуемые диаметр и длина, скорость газа, объём жидкости, вердикт «займёт / не займёт», фазовая картина входа.",
  formula:"v_max = K·√((ρl − ρg)/ρg)   [м/с]\nA_газ = Qg/(3600·v_max);  A_газ = (1 − φ)·πD²/4  →  D = √(4·A_газ/((1−φ)·π))\nV_ж = Ql·t_отстоя/60;  V_ж = φ·πD²/4·L  →  L = 4·V_ж/(φ·πD²)\nПроверка: D ≤ Dдост и L ≤ Lдост",
  assum:"K = 0.107 м/с — типично для горизонтального сепаратора с сетчатым отбойником; φ — доля сечения под жидкостью. Газ приведён к рабочим условиям.",
  limits:"K снижают на 30…50 % при пенении, высоком давлении и отсутствии отбойника. Время отстоя 1…5 мин для нефти; для трёхфазных — отдельно.",
  src:"Souders & Brown (1934); API 12J / GPSA Engineering Data Book, разд. 7."},
 compute(V,R){
  const g=9.80665,dR=Math.max(V.rl-V.rg,1),vmax=V.K*Math.sqrt(dR/Math.max(V.rg,.01));
  const phi=clamp(V.fill/100,.2,.8);
  const Ag=(V.qg/3600)/Math.max(vmax,1e-6);
  const Dg=Math.sqrt(4*Ag/((1-phi)*Math.PI));
  const Vliq=V.ql*(V.tres/60);
  const Dl=Math.cbrt(4*Vliq/(phi*Math.PI*V.ld));
  const D=Math.max(Dg,Dl),L=V.ld*D;
  const fitD=D<=V.Dav,fitL=L<=V.Lav,fit=fitD&&fitL;
  const vFact=(V.qg/3600)/Math.max((1-phi)*Math.PI*V.Dav*V.Dav/4,1e-9);
  const util=vFact/Math.max(vmax,1e-9)*100;
  const parts=[{v:V.beta*100,n:"Пар",c:col(1)},{v:(1-V.beta)*100,n:"Жидкость",c:col(0)}];
  const lim=[];
  if(!fit)lim.push("Требуемый габарит "+fmt(D,2)+"×"+fmt(L,2)+" м не входит в доступный "+fmt(V.Dav,2)+"×"+fmt(V.Lav,2)+" м.");
  if(util>100)lim.push("Фактическая скорость газа "+fmt(vFact,3)+" м/с превышает предел "+fmt(vmax,3)+" м/с — унос жидкости.");
  if(V.tres<60)lim.push("Время отстоя < 1 мин — риск уноса жидкости с газом.");
  if(V.rg>=V.rl)lim.push("ρ газа ≥ ρ жидкости — разделение невозможно, проверьте рабочие условия.");
  /* эскиз сепаратора */
  const W=680,H=250,pad=26,bw=W-2*pad,bh=120,y0=60;
  const sc=Math.min(bw/Math.max(L,1),bh/Math.max(D,.5));
  const dpx=Math.max(40,D*sc),lpx=Math.max(90,L*sc);
  const avl=Math.max(90,V.Lav*sc),avd=Math.max(40,V.Dav*sc);
  let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'">';
  s+='<rect x="'+pad+'" y="'+y0+'" width="'+avl+'" height="'+avd+'" rx="'+(avd/2)+'" fill="none" stroke="'+cv("--line2")+'" stroke-width="2" stroke-dasharray="7 5"/>';
  s+='<text x="'+(pad+avl/2)+'" y="'+(y0-8)+'" font-size="10.5" text-anchor="middle" fill="'+cv("--dim")+'">доступный габарит '+fmt(V.Dav,2)+'×'+fmt(V.Lav,2)+' м</text>';
  const x=pad+6,y=y0+6;
  s+='<rect x="'+x+'" y="'+y+'" width="'+lpx+'" height="'+dpx+'" rx="'+(dpx/2)+'" fill="'+cv("--surface3")+'" stroke="'+(fit?cv("--ok"):cv("--bad"))+'" stroke-width="2.4"/>';
  s+='<clipPath id="cp"><rect x="'+x+'" y="'+y+'" width="'+lpx+'" height="'+dpx+'" rx="'+(dpx/2)+'"/></clipPath>';
  s+='<g clip-path="url(#cp)"><rect x="'+x+'" y="'+(y+dpx*(1-phi))+'" width="'+lpx+'" height="'+(dpx*phi)+'" fill="'+col(0)+'" opacity=".55"/>'
   +'<rect x="'+x+'" y="'+y+'" width="'+lpx+'" height="'+(dpx*(1-phi))+'" fill="'+col(1)+'" opacity=".22"/></g>';
  s+='<text x="'+(x+lpx/2)+'" y="'+(y+dpx+18)+'" font-size="11" text-anchor="middle" fill="'+cv("--ink2")+'">требуется '+fmt(D,2)+' × '+fmt(L,2)+' м · L/D '+fmt(V.ld,1)+'</text>';
  s+='<text x="'+(x+10)+'" y="'+(y+dpx*(1-phi)-6)+'" font-size="10" fill="'+col(1)+'">газ '+fmt(vFact,3)+' м/с</text>';
  s+='<text x="'+(x+10)+'" y="'+(y+dpx-8)+'" font-size="10" fill="'+cv("--ink")+'">жидкость '+fmt(Vliq,1)+' м³</text>';
  s+="</svg>";
  return {cards:[
   {l:"Вердикт",v:fit?"займёт":"НЕ займёт",u:"",st:fit?"ok":"bad",big:true,note:"требуется "+fmt(D,2)+" × "+fmt(L,2)+" м"},
   {l:"Требуемый D",v:fmt(D,2),u:"м",st:fitD?"ok":"bad",note:"по газу "+fmt(Dg,2)+" · по жидкости "+fmt(Dl,2)},
   {l:"Требуемая L",v:fmt(L,2),u:"м",st:fitL?"ok":"bad"},
   {l:"Предел скорости газа",v:fmt(vmax,3),u:"м/с",st:"info",note:"K = "+fmt(V.K,3)},
   {l:"Загрузка по газу",v:fmt(util,0),u:"%",st:util<=85?"ok":util<=100?"warn":"bad"},
   {l:"Объём жидкости",v:fmt(Vliq,2),u:"м³",st:"info",note:"отстой "+fmt(V.tres/60,1)+" мин"}
  ],limits:lim,chart:{title:"Габарит и фазы",inner:s+
    '<div style="display:grid;grid-template-columns:1fr 190px;gap:10px;align-items:center;padding:0 12px 12px"><div class="mut" style="font-size:var(--fs-xs)">Фазовая картина входа (β — доля пара):</div><div>'+donut(parts,150)+'</div></div>',
    legend:'<span><i style="background:'+col(1)+'"></i>пар '+fmt(V.beta*100,0)+' %</span><span><i style="background:'+col(0)+'"></i>жидкость '+fmt((1-V.beta)*100,0)+' %</span>',meta:{kind:"none"}}};
 },
 checks:[{n:"v_max: K .107, ρl720 ρg45",exp:.4152,tol:.004,f:()=>.107*Math.sqrt((720-45)/45)},
  {n:"Vж: 120 м³/ч · 3 мин",exp:6,tol:1e-9,f:()=>120*(180/60)/60},
  {n:"D по газу: 35000 м³/ч, vmax .415, φ.5",exp:3.14,tol:.06,f:()=>Math.sqrt(4*((35000/3600)/.4152)/(0.5*Math.PI))}]
});

/* ---------- P2-17 Гидраты + метанол ---------- */
def({id:"hydrate",group:"Поле",p:"P2",icon:"hydrate",title:"Гидраты и метанол",
 short:"Кривая гидратообразования, сколько метанола лить",
 tags:["гидраты","метанол","ингибитор","hammerschmidt","хамершмидт","мотие","росa","точка росы","мег"],
 fields:[
  F("p","Давление",{val:8,unit:"МПа",units:["МПа","кПа","бар","кгс/см²","psi"],g:"P",step:.1}),
  F("gamma","Отн. плотность газа (по воздуху)",{val:.62,step:.01}),
  F("top","Рабочая температура",{val:8,unit:"°C",units:["°C","K","°F"],g:"T",step:.5}),
  F("safety","Запас по T",{val:3,step:.5}),
  F("qw","Вода (конденсат + пластовая)",{val:180,unit:"кг/ч",units:["кг/ч","т/ч","кг/с"],g:"MASS",step:1}),
  F("inh","Ингибитор",{kind:"sel",val:"meoh",opts:[{v:"meoh",t:"Метанол (M=32)"},{v:"meg",t:"МЭГ (M=62)"},{v:"deg",t:"ДЭГ (M=106)"}]}),
  F("wloss","Потери в пар/углеводороды",{val:25,step:1}),
  F("qg","Расход газа",{val:400,unit:"м³/ч",units:["м³/ч","м³/сут"],g:"VOL",step:10})
 ],
 doc:{in:"P, относительная плотность газа, рабочая T, запас, расход воды, тип ингибитора и потери.",
  out:"T гидратообразования, требуемое понижение, массовая доля ингибитора в водной фазе, расход ингибитора (кг/ч, л/ч) с учётом потерь.",
  formula:"Motiee (1991): T[°F] = −238.24469 + 78.99667·lgP − 5.352544·(lgP)² + 349.473877·γ − 150.854675·γ² − 27.604065·γ·lgP,  P в psia\nΔT = Tгидр − Tраб + запас\nHammerschmidt: ΔT[°C] = 1297·w/(M·(100 − w))  →  w = 100·ΔT·M/(1297 + ΔT·M)\nРасход = w/(100 − w)·Qводы · (1 + потери/100)",
  assum:"Метанол распределяется между водной фазой, паром и жидкими углеводородами; надбавка на потери задаётся пользователем (типично 20…40 % для метанола).",
  limits:"Hammerschmidt надёжен при w ≤ 20…25 % масс. (метанол) — при больших концентрациях занижает эффект, переходите к Nielsen–Bucklin/термодинамике. Motiee: γ = 0.55…0.9, P = 0.5…20 МПа.",
  src:"Motiee (1991); Hammerschmidt (1934); GPSA Engineering Data Book, разд. 20 (Hydrate Inhibition)."},
 compute(V,R){
  const M=R.inh==="meg"?62:R.inh==="deg"?106:32;
  const Th=hydrateT(V.p,V.gamma),dT=Math.max(0,Th-V.top+V.safety);
  const w=hammW(dT,M),ratio=w/(100-w);
  const massInj=ratio*V.qw*(1+V.wloss/100);
  const rhoInj=R.inh==="meoh"?792:R.inh==="meg"?1113:1118;
  const volInj=massInj/rhoInj*1000;
  const N=clamp(S.chart.quality,40,400),pts=[],ptsS=[];
  const a=.5,b=Math.max(20,V.p*1.6);
  for(let i=0;i<=N;i++){const P=lerp(a,b,i/N);pts.push([P,hydrateT(P*1000,V.gamma)]);ptsS.push([P,hydrateT(P*1000,V.gamma)-dT]);}
  const ys=pts.map(p=>p[1]).concat([V.top]),lo=Math.min(...ys,V.top)-6,hi=Math.max(...ys)+5,span=(hi-lo)/S.chart.zoom,mid=(hi+lo)/2;
  const p=plot({x:[a,b],y:[mid-span/2,mid+span/2],series:[{pts:pts,color:col(3),name:"гидраты"},{pts:ptsS,color:col(2),dash:"6 4",name:"с ингибитором"}],
    xl:"P, МПа",yl:"T, °C"});
  const inHyd=V.top<Th;
  let ex='<circle cx="'+p.X(V.p)+'" cy="'+p.Y(V.top)+'" r="8" fill="'+(inHyd?cv("--bad"):cv("--ok"))+'" stroke="'+cv("--surface")+'" stroke-width="2"/>'
   +'<text x="'+(p.X(V.p)+11)+'" y="'+(p.Y(V.top)+4)+'" font-size="11" font-weight="700" fill="'+(inHyd?cv("--bad"):cv("--ok"))+'">режим '+fmt(V.top,1)+' °C</text>';
  p.svg=p.svg.replace("</svg>",ex+"</svg>");
  const lim=[];
  if(w>25)lim.push("w = "+fmt(w,1)+" % > 25 % — Hammerschmidt занижает эффект; нужен Nielsen–Bucklin или расчёт по термодинамике.");
  if(V.gamma<.55||V.gamma>.9)lim.push("γ вне 0.55…0.9 — корреляция Motiee экстраполируется.");
  if(V.p>20000)lim.push("P > 20 МПа — вне области Motiee.");
  if(dT<=0)lim.push("Понижение не требуется: режим вне зоны гидратообразования с учётом запаса.");
  return {cards:[
   {l:"T гидратообразования",v:fmt(Th,1),u:"°C",st:inHyd?"bad":"ok",big:true,note:"при "+fmt(V.p/1000,2)+" МПа, γ = "+fmt(V.gamma,2)},
   {l:"Режим",v:inHyd?"В ЗОНЕ ГИДРАТОВ":"вне зоны",u:"",st:inHyd?"bad":"ok",note:"рабочая T "+fmt(V.top,1)+" °C"},
   {l:"Требуемое понижение ΔT",v:fmt(dT,1),u:"°C",st:"info",note:"включая запас "+fmt(V.safety,1)+" °C"},
   {l:"Концентрация в водной фазе",v:fmt(w,1),u:"% масс.",st:w>25?"warn":"ok"},
   {l:"Расход ингибитора",v:fmt(massInj,1),u:"кг/ч",st:"ok",note:fmt(volInj,1)+" л/ч · с потерями "+fmt(V.wloss,0)+" %"},
   {l:"Удельный расход",v:fmt(massInj/Math.max(V.qg,1),3),u:"кг/1000 м³",st:"info"}
  ],limits:lim,chart:{title:"Кривая гидратообразования и сдвиг ингибитором",inner:p.svg,
    legend:'<span><i style="background:'+col(3)+'"></i>граница гидратов</span><span><i style="background:'+col(2)+'"></i>с ингибитором</span><span><i style="background:'+(inHyd?cv("--bad"):cv("--ok"))+'"></i>рабочая точка</span>',
    hint:"Тяните по графику: по горизонтали меняется давление, по вертикали — рабочая температура.",meta:{kind:"lin2",p:p}},
  tables:[{title:"Требуемая концентрация при разных ΔT",head:["ΔT, °C","w, % масс.","кг ингибитора / кг воды"],
    rows:[2,4,6,8,10,12,15,20].map(d=>[fmt(d,0),fmt(hammW(d,M),1),fmt(hammW(d,M)/(100-hammW(d,M)),3)]),num:[0,1,2]}]};
 },
 checks:[{n:"Hammerschmidt w=20 %, M=32 → ΔT ≈ 10.1",exp:10.13,tol:.05,f:()=>hammDT(20,32)},
  {n:"Обратная: ΔT 10.13 → w 20",exp:20,tol:.02,f:()=>hammW(10.1328125,32)},
  {n:"Motiee γ0.6, 1000 psia ≈ 13.5 °C",exp:13.5,tol:2,f:()=>hydrateT(6894.757,.6)}]
});

/* ---------- P3-21 Импорт лаборатории ---------- */
def({id:"lab",group:"Данные",p:"P3",icon:"lab",title:"Импорт лабораторной гонки",
 short:".xlsx / вставка из Excel → ИТК → псевдокомпоненты",
 tags:["импорт","xlsx","excel","лаборатория","d86","д86","итк","таблица","sheetjs","вставка"],
 fields:[
  F("raw","Таблица: T °C — отгон %",{kind:"area",val:"0  0\n10  6\n30  22\n50  45\n70  66\n90  86\n100  97"}),
  F("kind","Тип гонки",{kind:"sel",val:"d86",opts:[{v:"d86",t:"Д86 (пересчитать в ИТК)"},{v:"tbp",t:"ИТК / TBP (как есть)"}]}),
  F("n","Фракций на выходе",{kind:"range",val:10,min:5,max:24,step:1}),
  F("rho","ρ15 образца",{val:845,step:1})
 ],
 doc:{in:"Файл .xlsx (колонки A — T, B — отгон) либо вставка из Excel / CSV-текст.",
  out:"Распознанная таблица, пересчёт Д86 → ИТК, псевдокомпоненты и файл-мост для конструктора НПЗ.",
  formula:"Д86 → ИТК по точкам API (см. калькулятор Д86 ↔ ИТК), интерполяция между точками.\nДалее — равновыходное разбиение и корреляции M / UOP K.",
  assum:"Читается первый лист книги; ожидаются две числовые колонки. Заголовки и пустые строки пропускаются.",
  limits:"Чтение .xlsx выполняется в браузере (ZIP + DecompressionStream). Если браузер не поддерживает — используйте вставку из Excel (Ctrl+V) или CSV.",
  src:"Формат OOXML (ECMA-376); API TDB 3A1.1; внутреннее правило проекта: эталон + selfcheck."},
 compute(V,R){
  const pts=parsePairs(R.raw);
  if(pts.length<2)return {cards:[{l:"Данные не распознаны",v:"—",st:"bad",note:"нужны две числовые колонки"}],
    limits:["Вставьте таблицу или загрузите .xlsx: колонка A — температура, B — отгон %."]};
  const P=[0,10,30,50,70,90,100];
  const tbp=R.kind==="d86"?pts.map(p=>{
    let nearest=P.reduce((b,x)=>Math.abs(x-p[1])<Math.abs(b-p[1])?x:b,P[0]);
    return Math.abs(nearest-p[1])<=6?[d86toTBP(p[0],nearest),p[1]]:[p[0],p[1]];
  }):pts.slice();
  const N=clamp(Math.round(V.n),5,24),y0=tbp[0][1],y1=tbp[tbp.length-1][1],cuts=[];
  for(let k=0;k<N;k++){const ya=lerp(y0,y1,k/N),yb=lerp(y0,y1,(k+1)/N);
    const ta=itkInv(tbp,ya),tb=itkInv(tbp,yb),tm=(ta+tb)/2;
    const sg=sgOf(lerp(700,945,k/(N-1||1)));
    cuts.push({i:k+1,ta:ta,tb:tb,tm:tm,w:(yb-ya)/100,rho:sg*RHO_W60,sg:sg,mw:mwRD(tm+273.15,sg),K:watsonK(tm+273.15,sg)});}
  const N2=clamp(S.chart.quality,40,400),c1=[],c2=[];
  for(let i=0;i<=N2;i++){const t=lerp(pts[0][0],pts[pts.length-1][0],i/N2);c1.push([t,itkAt(pts,t)]);c2.push([t,itkAt(tbp,t)]);}
  const lo=Math.min(pts[0][0],tbp[0][0])-10,hi=Math.max(pts[pts.length-1][0],tbp[tbp.length-1][0])+10;

/* ---------- P3-22 Сверка ---------- */
def({id:"recon",group:"Данные",p:"P3",icon:"recon",title:"Сверка расчёт / факт",
 short:"Таблица отклонений по узлам с допуском",
 tags:["сверка","баланс","факт","расчет","отклонение","эвр","материальный баланс","допуск"],
 fields:[
  F("tol","Допуск отклонения",{val:2,step:.1}),
  F("rows","Узлы:名称 расчёт факт",{kind:"area",val:"Бензин товарный  182000  178400\nДизтопливо  246000  251200\nКеросин  92000  90100\nМазут  318000  309500\nГаз топливный  21000  24300\nПотери  9000  12600"}),
  F("unit","Единица",{kind:"sel",val:"т/мес",opts:["т/мес","т/сут","т/ч","м³/мес"]})
 ],
 doc:{in:"Строки «название расчёт факт» и допуск отклонения.",
  out:"Таблица расчёт / факт / Δ / Δ%, статус по допуску, суммарный небаланс и диаграмма отклонений.",
  formula:"Δ = факт − расчёт;  Δ% = Δ/расчёт·100\nНебаланс = Σфакт − Σрасчёт;  относительный небаланс = небаланс/Σрасчёт·100",
  assum:"Строки вводятся вручную или вставляются из Excel. Название может содержать пробелы — последние два числа строки трактуются как расчёт и факт.",
  limits:"Сверка не заменяет выверенный материальный баланс предприятия: учитывайте изменение остатков в резервуарах и потери.",
  src:"Практика сведения баланса цеха; внутреннее правило проекта: эталон + selfcheck."},
 compute(V,R){
  const rows=[];String(R.rows||"").split(/\n+/).forEach(l=>{
    const m=l.trim().match(/^(.*?)[\s;,\t]+(-?[\d.,]+)[\s;,\t]+(-?[\d.,]+)$/);
    if(!m)return;const c=num(m[2]),f=num(m[3]);if(!isN(c)||!isN(f))return;
    rows.push({n:m[1].trim(),c:c,f:f,d:f-c,p:c!==0?(f-c)/c*100:0});});
  if(!rows.length)return {cards:[{l:"Нет строк",v:"—",st:"bad",note:"формат: название расчёт факт"}],limits:["Введите строки «название расчёт факт»."]};
  const sc=rows.reduce((s,r)=>s+r.c,0),sf=rows.reduce((s,r)=>s+r.f,0);
  const nb=sf-sc,nbp=sc!==0?nb/sc*100:0;
  const bad=rows.filter(r=>Math.abs(r.p)>V.tol).length;
  const items=rows.map((r,i)=>({n:r.n,v:Math.abs(r.p),t:(r.p>=0?"+":"")+fmt(r.p,2)+" %",c:Math.abs(r.p)>V.tol?cv("--bad"):cv("--ok")}));
  const lim=[];
  if(bad)lim.push(bad+" узл(ов) вне допуска ±"+fmt(V.tol,1)+" % — разберите причины: остатки, потери, качество учёта.");
  if(Math.abs(nbp)>1)lim.push("Суммарный небаланс "+fmt(nbp,2)+" % — проверьте изменение остатков и потери.");
  return {cards:[
   {l:"Суммарный небаланс",v:(nb>=0?"+":"")+fmt(nb,0),u:R.unit,st:Math.abs(nbp)<=1?"ok":Math.abs(nbp)<=2?"warn":"bad",big:true,note:fmt(nbp,2)+" % от расчёта"},
   {l:"Расчёт / факт",v:fmt(sc,0)+" / "+fmt(sf,0),u:R.unit,st:"info"},
   {l:"Узлов вне допуска",v:String(bad)+" / "+rows.length,u:"",st:bad?"warn":"ok"},
   {l:"Макс. отклонение",v:fmt(Math.max(...rows.map(r=>Math.abs(r.p))),2),u:"%",st:"info"}
  ],limits:lim,chart:{title:"Отклонения по узлам",inner:'<div style="padding:12px">'+barsH(items)+'</div>',meta:{kind:"none"}},
  tables:[{title:"Сверка",head:["Узел","Расчёт","Факт","Δ","Δ, %","Статус"],
    rows:rows.map(r=>[esc(r.n),fmt(r.c,0),fmt(r.f,0),(r.d>=0?"+":"")+fmt(r.d,0),(r.p>=0?"+":"")+fmt(r.p,2),
      Math.abs(r.p)<=V.tol?'<span class="chip ok">в допуске</span>':'<span class="chip bad">вне</span>']),num:[1,2,3,4]}]};
 },
 checks:[{n:"Δ%: 100 → 102",exp:2,tol:1e-9,f:()=>(102-100)/100*100},
  {n:"Парсер строки с пробелами в названии",exp:182000,tol:1e-9,f:()=>{
    const m="Бензин товарный  182000  178400".match(/^(.*?)[\s;,\t]+(-?[\d.,]+)[\s;,\t]+(-?[\d.,]+)$/);return num(m[2]);}},
  {n:"Небаланс суммы",exp:-3600,tol:1e-9,f:()=>(178400+251200)-(182000+246000)}]
});

const CHECK_RESULTS=[];
function runChecks(){
  CHECK_RESULTS.length=0;
  CALCS.forEach(c=>(c.checks||[]).forEach(k=>{
    let got=NaN,err=null;
    try{got=k.f();}catch(e){err=String(e&&e.message||e);}
    const pass=!err&&isN(got)&&Math.abs(got-k.exp)<=k.tol;
    CHECK_RESULTS.push({calc:c.id,title:c.title,n:k.n,exp:k.exp,got:got,tol:k.tol,pass:pass,err:err});
  }));
  const ok=CHECK_RESULTS.filter(r=>r.pass).length,tot=CHECK_RESULTS.length;
  const b=$("#chkBadge"),t=$("#chkTxt");
  if(t)t.textContent=ok+"/"+tot;
  if(b)b.classList.toggle("fail",ok!==tot);
  const dot=b&&b.querySelector(".dot");if(dot)dot.style.background=ok===tot?cv("--ok"):cv("--bad");
  return {ok:ok,tot:tot};
}

function vals(c){
  if(!S.v[c.id])S.v[c.id]={};

    if(S.v[c.id][f.k]===undefined)S.v[c.id][f.k]=f.val;
    if(f.units&&S.u[c.id][f.k]===undefined)S.u[c.id][f.k]=f.unit||f.units[0];
    if(f.kind==="unitOf"&&S.u[c.id][f.k]===undefined)S.u[c.id][f.k]=f.val;

  const {R,U}=vals(c),V={};
  c.fields.forEach(f=>{

    if(f.kind==="num"||f.kind==="range"){
      const x=num(raw,typeof f.val==="number"?f.val:0);
      V[f.k]=f.g?toBase(f.g,x,U[f.k]):x;

function score(c,q){
  if(!q)return 1;
  const t=(c.title+" "+c.short+" "+c.tags.join(" ")+" "+c.id).toLowerCase();
  const words=q.toLowerCase().split(/\s+/).filter(Boolean);
  let s=0;words.forEach(w=>{if(c.id===w)s+=100;if(c.title.toLowerCase().includes(w))s+=40;if(t.includes(w))s+=10;});
  return s;
}

function bindChart(){
  const wrap=$("#chartWrap");if(!wrap)return;
  const meta=CH.meta;if(!meta||meta.kind==="none")return;
  wrap.classList.add("cursor");
  const svg=wrap.querySelector("svg");if(!svg)return;
  const pt=ev=>{
    const r=svg.getBoundingClientRect();
    const vb=svg.viewBox.baseVal;
    return {x:(ev.clientX-r.left)/r.width*vb.width,y:(ev.clientY-r.top)/r.height*vb.height};
  };
  let mode=null;
  const setV=(k,val)=>{S.v[CUR.id][k]=val;const f=CUR.fields.find(f=>f.k===k);
    const inp=document.querySelector('[data-k="'+k+'"]');
    if(inp&&f){if(f.g){const u=S.u[CUR.id][k];inp.value=fmt(fromBase(f.g,val,u),2);}else inp.value=fmt(val,2);}
    save();compute();};
  const down=ev=>{
    if(!CH.meta)return;
    const p=pt(ev);
    if(CH.meta.kind==="max"){
      const g=CH.meta.p,A=CH.maxHandles.a,B=CH.maxHandles.b;
      const da=Math.hypot(p.x-g.X(A[0]),p.y-g.Y(A[1])),db=Math.hypot(p.x-g.X(B[0]),p.y-g.Y(B[1]));
      mode=(da<24&&da<=db)?"a":(db<24?"b":"a");
    } else if(CH.meta.kind==="uop"){
      const g=CH.meta.geom;mode=Math.abs(p.x-g.xR)<Math.abs(p.x-g.xL)?"sg":"tb";
    } else mode="x";
    wrap.setPointerCapture&&wrap.setPointerCapture(ev.pointerId);
    move(ev);ev.preventDefault();
  };
  const move=ev=>{
    if(!mode||!CH.meta)return;
    const p=pt(ev),m=CH.meta;
    if(m.kind==="lin"){
      const x=clamp(m.p.invX(p.x),m.p.x[0],m.p.x[1]);
      const f=CUR.fields.find(f=>f.g==="T")||CUR.fields.find(f=>f.k==="t");
      if(CUR.id==="rvp"){setV("v"+(m.share+1),clamp(x,0,100));}
      else if(CUR.id==="inverse"){setV("target",clamp(m.p.invY(p.y),0,1e6));}
      else if(f){setV(f.k,f.g?x:x);}
    } else if(m.kind==="lin2"){
      const x=clamp(m.p.invX(p.x),m.p.x[0],m.p.x[1]),y=clamp(m.p.invY(p.y),m.p.y[0],m.p.y[1]);
      S.v[CUR.id].p=fmt(x*1000,1);S.v[CUR.id].top=fmt(y,1);
      const ip=document.querySelector('[data-k="p"]'),it=document.querySelector('[data-k="top"]');
      if(ip)ip.value=fmt(x,2);if(it)it.value=fmt(y,1);save();compute();
    } else if(m.kind==="cox"){
      const xv=clamp(m.p.invX(p.x),m.p.x[0],m.p.x[1]);
      const T=1/xv+43-273.15;setV("t",clamp(T,-80,340));
    } else if(m.kind==="max"){
      const g=m.p;const x=clamp(g.invX(p.x),g.x[0],g.x[1]),y=clamp(g.invY(p.y),g.y[0],g.y[1]);
      CH.maxHandles[mode]=[x,y];compute();
    } else if(m.kind==="uop"){
      const g=m.geom;
      if(mode==="tb"){const u=clamp(g.uDom[0]+(p.y-g.PT)/(g.ih/(g.uDom[1]-g.uDom[0])),g.uDom[0],g.uDom[1]);
        const T=Math.pow(10,3*u)/1.8-273.15;setV("tb",clamp(T,20,520));}
      else {const sOut=g.ih/(g.wDom[1]-g.wDom[0]);const w=clamp(g.wDom[0]+(p.y-g.PT)/sOut,g.wDom[0],g.wDom[1]);
        const sg=Math.pow(10,-w);setV("rho",clamp(sg*RHO_W60,560,1120));}
    }
  };
  const up=()=>{mode=null;};
  wrap.addEventListener("pointerdown",down);
  wrap.addEventListener("pointermove",move);
  wrap.addEventListener("pointerup",up);
  wrap.addEventListener("pointercancel",up);
  wrap.addEventListener("pointerleave",up);
}

function bridgeCSV(cuts){

/* ==========================================================================
   15. XLSX БЕЗ ЗАВИСИМОСТЕЙ (ZIP + DecompressionStream)
   ========================================================================== */
async function readXlsx(file){
  if(typeof DecompressionStream==="undefined")throw new Error("Браузер не поддерживает распаковку — вставьте таблицу из Excel (Ctrl+V)");
  const buf=new Uint8Array(await file.arrayBuffer());
  const dv=new DataView(buf.buffer);
  let eocd=-1;
  for(let i=buf.length-22;i>=Math.max(0,buf.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error("Не найден ZIP-каталог: файл не .xlsx");
  const n=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);
  const files={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true),elen=dv.getUint16(off+30,true),clen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(buf.subarray(off+46,off+46+nlen));
    const nl2=dv.getUint16(lho+26,true),el2=dv.getUint16(lho+28,true);
    const dataStart=lho+30+nl2+el2;
    const data=buf.subarray(dataStart,dataStart+csize);
    files[name]={method:method,data:data};
    off+=46+nlen+elen+clen;
  }
  async function text(name){
    const f=files[name];if(!f)return "";
    if(f.method===0)return new TextDecoder().decode(f.data);
    const ds=new DecompressionStream("deflate-raw");
    const stream=new Blob([f.data]).stream().pipeThrough(ds);
    return await new Response(stream).text();
  }
  const sharedXml=await text("xl/sharedStrings.xml");
  const shared=[];
  if(sharedXml){
    const doc=new DOMParser().parseFromString(sharedXml,"application/xml");
    Array.from(doc.getElementsByTagName("si")).forEach(si=>{
      shared.push(Array.from(si.getElementsByTagName("t")).map(t=>t.textContent).join(""));});
  }
  let sheetName=Object.keys(files).find(k=>/^xl\/worksheets\/sheet1\.xml$/.test(k))
    ||Object.keys(files).filter(k=>/^xl\/worksheets\/.*\.xml$/.test(k)).sort()[0];
  if(!sheetName)throw new Error("В книге не найден лист");
  const xml=await text(sheetName);
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  const rows=[];
  Array.from(doc.getElementsByTagName("row")).forEach(r=>{
    const cells={};
    Array.from(r.getElementsByTagName("c")).forEach(c=>{
      const ref=c.getAttribute("r")||"";const col=ref.replace(/\d+/g,"");
      const t=c.getAttribute("t");
      let v="";
      const vn=c.getElementsByTagName("v")[0];
      const is=c.getElementsByTagName("is")[0];
      if(t==="s"&&vn)v=shared[parseInt(vn.textContent,10)]||"";
      else if(t==="inlineStr"&&is)v=Array.from(is.getElementsByTagName("t")).map(x=>x.textContent).join("");
      else if(vn)v=vn.textContent;
      cells[col]=v;
    });
    rows.push(cells);
  });
  const pairs=[];
  rows.forEach(c=>{
    const keys=Object.keys(c).sort();
    const vals=keys.map(k=>num(String(c[k]).replace(",",".")));
    const nums=vals.filter(isN);
    if(nums.length>=2)pairs.push([nums[0],nums[1]]);
    else{
      const a=num(String(c.A||"").replace(",",".")),b=num(String(c.B||"").replace(",","."));
      if(isN(a)&&isN(b))pairs.push([a,b]);
    }
  });
  if(pairs.length<2)throw new Error("Не найдено двух числовых колонок (A — T, B — отгон)");
  return pairs;
}

      $$("#palList .palitem").forEach((x,i)=>x.classList.toggle("on",i===palIdx));
      const on=$("#palList .palitem.on");if(on)on.scrollIntoView({block:"nearest"});}
    if(e.key==="Enter"&&palItems[palIdx]){palClose();go(palItems[palIdx].id);}
  }
});
/* корректный поиск в шапке: открывает палитру с уже введённым текстом */
$("#q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){const v=$("#q").value;palOpen();$("#palQ").value=v;palFill(v);}
});
window.addEventListener("hashchange",()=>readHash());
window.addEventListener("resize",()=>{if(CUR&&RESULT&&RESULT.chart)renderResults(RESULT);});

/* ==========================================================================
   17. СТАРТ
   ========================================================================== */
(function boot(){
  load();
  document.documentElement.setAttribute("data-theme",S.theme||"night");
  ["day","night","field"].forEach(x=>{const b=$("#th"+x[0].toUpperCase()+x.slice(1));if(b)b.classList.toggle("on",x===S.theme);});
  if(!S.chart.quality||S.chart.quality<40)S.chart.quality=140;
  const mq=window.matchMedia("(max-width:900px)");
  const syncMenu=()=>{$("#btnMenu").style.display=mq.matches?"grid":"none";};
  syncMenu();mq.addEventListener?mq.addEventListener("change",syncMenu):mq.addListener(syncMenu);
  renderRail();
  const r=runChecks();
  if(!readHash())go("home");
  if(r.ok!==r.tot)toast("Самопроверка: "+r.ok+"/"+r.tot+" — есть отклонения, откройте «Самопроверка»","bad");
})();
</script>
